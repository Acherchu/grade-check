<script>
// ================= MORE QUESTIONS — 7th English: reading & writing =================
{
  const STAGES = ['exposition', 'rising action', 'climax', 'falling action', 'resolution'];
  const STORIES = [
    ['Maya is a shy seventh grader who loves singing alone in her room.', 'Her friend signs her up for the talent show, and Maya panics every time she practices.', 'On the night of the show, Maya freezes on stage — then takes a deep breath and starts to sing.', 'The crowd cheers, and Maya realizes she actually enjoyed performing.', 'Maya joins the school choir and makes new friends.'],
    ['Leo lives on a farm with his old dog, Biscuit.', 'A storm hits, Biscuit runs into the woods, and Leo searches for hours.', 'Leo hears barking from a ravine and climbs down to pull Biscuit out.', 'Soaked and tired, Leo carries Biscuit home as the storm fades.', 'Leo builds Biscuit a sturdy doghouse so he feels safe during storms.'],
    ['Priya and Sam are science fair partners, but they don\'t get along.', 'They argue constantly, and their volcano model breaks the night before the fair.', 'At the fair, they have ten minutes to fix the model together before the judges arrive.', 'The volcano erupts perfectly, and the judges take notes.', 'They win second place and agree to be partners again next year.'],
    ['Four friends go on their first camping trip without their parents.', 'They get lost on a hike, and their flashlight batteries start dying.', 'As night falls, they spot the lake and use it to find the trail back.', 'They reach camp cold but relieved and build a fire.', 'They promise to always bring a map from now on.'],
  ];
  const TERMS = [['the main character of a story','protagonist'],['the character or force working against the main character','antagonist'],['a character who changes during the story','dynamic character'],['a character who stays the same throughout the story','static character'],['a complex character with many different traits','round character'],['a simple character with only one or two traits','flat character'],['the time and place of a story','setting'],['the main problem in a story','conflict'],['the person or voice telling the story','narrator'],['the conversation between characters','dialogue'],['the series of events in a story','plot'],['the message or lesson about life','theme'],['the way an author shows what a character is like','characterization']];
  addTo(7, 'English', 'reading',
    () => { const story = pick(STORIES), i = R(0, 4);
      return MQ(`Story events in order:\n${story.map((e, k) => `${k + 1}. ${e}`).join('\n')}\n\nWhich part of the plot is event ${i + 1}?`, STAGES[i], STAGES.filter((_, k) => k !== i),
        `Event ${i + 1} is the ${STAGES[i]}. Plot map: exposition (meet the characters and setting) → rising action (problems build) → climax (the turning point, highest tension) → falling action (things wind down) → resolution (how it ends).`); },
    () => whichGroup({
        'first person': ['I grabbed my backpack and ran for the bus.','We had never seen so much snow in our lives.','My heart pounded as I stepped onto the stage.','Nobody believed me when I said I saw a ghost.'],
        'second person': ['You open the door and step into a dark hallway.','First, you mix the flour and sugar in a bowl.','You feel the cold wind on your face as you climb.','Imagine you are standing on the moon.'],
        'third person limited': ['Jada wondered if her friends were mad at her. She had no idea what they were thinking.','Carlos stared at the test, worried he would fail.','Emma felt a chill as she walked into the old house alone.','Ben hoped nobody noticed his shaking hands.'],
        'third person omniscient': ['Mia thought the party was boring, while her brother secretly thought it was the best night of his life.','The teacher worried about test scores, and every student secretly feared failing.','The dog wanted to play, the cat wanted to sleep, and the girl just wanted some quiet.','Sam believed he had won, but Ana knew the judges had already chosen her.'] },
      (label, s) => ({ q: `What point of view is this written in?\n"${s}"`, explain: `This is ${label}. First person: the narrator is in the story (I, we). Second person: speaks to the reader (you). Third person limited: he/she/they, with only ONE character's thoughts. Third person omniscient: the narrator knows the thoughts of MANY characters.` })),
    () => fromTable(Math.random() < .5 ? TERMS : TERMS.map(([a, b]) => [b, a]), ([a, b]) => ({ q: TERMS.some(t => t[0] === a) ? `Which story term means ${a}?` : `What is a "${a}"?`, explain: TERMS.some(t => t[0] === a) ? `That's the ${b}.` + ' Tip: dynamic = changes (think "dynamite" — big change); static = stays still.' : `A ${a} is ${b}.` })),
    () => whichGroup({
        'character vs. character': ['Two brothers fight over who gets the last slice of pizza.','A detective chases a jewel thief across the city.','A student argues with her coach about playing time.','Two rival knights battle for the crown.'],
        'character vs. self': ['A boy struggles to decide whether to admit he cheated.','A girl fights her fear of heights to climb the rock wall.','An athlete doubts himself before the big race.','A girl can\'t decide between her two best friends\' birthday parties.'],
        'character vs. nature': ['Hikers try to survive a blizzard on a mountain.','A family escapes a flood that destroys their town.','A sailor battles a huge storm at sea.','A boy must find water after getting lost in the desert.'],
        'character vs. society': ['A girl protests a law that says only boys can go to school.','A man fights an unfair rule that his whole town follows.','A teen refuses to obey the strict rules of a controlling government.','Workers stand up against unfair treatment by their city.'],
        'character vs. technology': ['A robot built by scientists starts taking over the lab.','A girl\'s smart home locks her inside.','A pilot fights to control a plane when its computer system fails.','A spaceship\'s computer refuses to let the crew leave.'] },
      (label, s) => ({ q: `What type of conflict is this?\n"${s}"`, explain: `This is ${label}. Internal conflict happens inside a character's mind (vs. self). External conflicts are against another character, nature, society (laws, rules, groups), or technology.` })),
    () => { const [s, c, ...w] = pick([
        ['A rabbit brags about his speed and naps during a race. A slow, steady tortoise keeps going and wins.','Steady effort can beat talent that isn\'t used.','Rabbits are faster than tortoises.','Never run in a race.','Naps are important.'],
        ['A boy cries "wolf!" as a joke many times. When a real wolf comes, nobody believes him.','If you lie, people may not believe you even when you tell the truth.','Wolves are dangerous.','Boys should not watch sheep.','Always shout for help.'],
        ['An ant works all summer storing food while a grasshopper plays. In winter, the grasshopper goes hungry.','It is wise to prepare for the future.','Grasshoppers are lazy.','Summer is better than winter.','Ants are stronger than grasshoppers.'],
        ['A new student is teased for her accent. Another girl sits with her at lunch, and they become best friends.','Kindness can make a big difference in someone\'s life.','Lunch is the best part of school.','Accents are hard to understand.','New schools are scary.'],
        ['A team full of star players loses because nobody passes. The next season they share the ball and win the championship.','Teamwork matters more than individual talent.','Basketball is hard.','Star players always win.','Practice is boring.'],
        ['A girl breaks her mom\'s vase and hides it. Her guilt grows until she confesses, and she feels relieved.','Honesty is better than hiding the truth.','Vases break easily.','Moms get angry.','Never play inside.'],
        ['A boy begs for the newest phone. After he gets it, he misses the time he used to spend outside with friends.','Relationships and experiences bring more happiness than things.','Phones are too expensive.','Always go outside.','New phones are better than old ones.'],
        ['After failing her driving test twice, Rosa keeps practicing and passes on her third try.','Don\'t give up when things get hard.','Driving tests are unfair.','Rosa is a bad driver.','Cars are dangerous.']]);
      return MQ(`Story: ${s}\nWhat is the best statement of the theme?`, c, w, `Theme: "${c}" A theme is a message about life that could apply to anyone — written as a full sentence. Wrong choices are usually just plot details or statements that only fit this one story.`); },
  );

  addTo(7, 'English', 'writing',
    () => whichGroup({
        'cause and effect': ['Because the factory dumped chemicals in the river, many fish died.','Heavy rains made the river flood, so families had to leave their homes.','As a result of the new bike lanes, fewer riders were hurt.','The power went out; therefore, the food in the fridge spoiled.'],
        'compare and contrast': ['Frogs and toads are both amphibians, but frogs have smooth skin while toads have bumpy skin.','Unlike summer, winter has short days and cold temperatures.','Both cats and dogs make good pets; however, dogs need more exercise.','Alligators have wide snouts, whereas crocodiles have narrow ones.'],
        'chronological order': ['First, crack the eggs. Next, whisk them. Finally, pour them into the hot pan.','In 1903 the Wright brothers flew; by 1969 astronauts walked on the moon.','The day began with breakfast, continued with a long hike, and ended with a campfire.','After the seed sprouts, the plant grows leaves, and later it produces flowers.'],
        'problem and solution': ['Our school threw away too much food, so students started a compost program.','Traffic was terrible downtown until the city added a new train line.','Many students came to school hungry, so the school began a free breakfast program.','Litter covered the park, so volunteers organized a monthly cleanup.'],
        'description': ['The Grand Canyon is a huge canyon carved by the Colorado River, with red and orange rock walls.','A monarch butterfly has bright orange wings with black veins and white spots.','The rainforest is hot, humid, and filled with tall trees, loud birds, and thick vines.','The old castle had crumbling stone walls, narrow windows, and one tall tower.'] },
      (label, s) => ({ q: `What text structure does this use?\n"${s}"`, explain: `This is ${label}. Signal words help: cause/effect (because, so, as a result, therefore), compare/contrast (both, unlike, however, whereas), chronological (first, next, then, dates), problem/solution (problem, so, solved by), description (lots of details about one thing).` })),
    () => fromGroups({
        fact: ['The Pacific is the largest ocean on Earth.','Water freezes at 32°F (0°C).','George Washington was the first U.S. President.','Spiders have eight legs.','The Sun is a star.','Chicago is a city in Illinois.','A week has seven days.','Penguins cannot fly.'],

    () => { const [p, c, ...w] = pick([
        ['Bees help plants grow by carrying pollen from flower to flower. Many fruits and vegetables we eat depend on this. Without bees, farmers would have a much harder time growing food.','Bees are very important for growing food.','Bees carry pollen.','Farmers grow vegetables.','Some fruits are sweet.'],
        ['Exercise strengthens your heart and muscles. It also improves your mood and helps you sleep better. Even a short walk each day can make a difference.','Exercise has many benefits for your body and mind.','Walking is a type of exercise.','Sleep is important.','Muscles get stronger.'],
        ['The Titanic was called "unsinkable." But in 1912 it hit an iceberg on its first voyage. There were not enough lifeboats, and more than 1,500 people died.','The "unsinkable" Titanic sank in a deadly disaster.','The Titanic had some lifeboats.','Icebergs are large.','The Titanic sailed in 1912.'],
        ['Recycling aluminum cans saves a lot of energy. Recycling paper saves trees. Recycling plastic helps keep waste out of the oceans.','Recycling helps save energy and protect the environment.','Aluminum cans can be recycled.','Oceans have plastic in them.','Paper comes from trees.'],
        ['Octopuses can change color in less than a second. They can squeeze through tiny openings and even use coconut shells as shelters. Scientists consider them some of the smartest invertebrates.','Octopuses have amazing abilities.','Octopuses live in the ocean.','Coconuts can be shelters.','Scientists study animals.'],
        ['Phones let students look up information and use learning apps. However, phones can also distract students in class. Some schools allow phones only at lunch.','Phones in school have both benefits and drawbacks.','Phones are used at lunch.','Learning apps are fun.','Students look up information.']]);
      return MQ(`Paragraph: ${p}\nWhat is the main idea?`, c, w, `Main idea: "${c}" The main idea is what the WHOLE paragraph is about. The wrong choices are single details — true, but too narrow to cover everything.`); },
    () => fromTable([['however','shows contrast'],['for example','gives an example'],['therefore','shows a result'],['in addition','adds information'],['first','shows the order of steps'],['in conclusion','sums up the writing'],['similarly','shows a comparison'],['because','gives a reason'],['meanwhile','shows something happening at the same time'],['on the other hand','shows contrast'],['as a result','shows a result'],['for instance','gives an example'],['furthermore','adds information'],['in contrast','shows contrast']],
      ([t, j]) => ({ q: `What job does the transition "${t}" do?`, explain: `"${t}" ${j}. Transitions connect ideas so writing flows. Group them by job: contrast (however, in contrast), result (therefore, as a result), example (for example, for instance), adding (in addition, furthermore).` })),
    () => { const [claim, c, ...w] = pick([

</script>

<script>
// ================= MORE QUESTIONS — 7th Science: genetics & matter =================
{
  const TRAITS = [['B','brown fur','white fur','a rabbit'],['T','tall stems','short stems','a pea plant'],['P','purple flowers','white flowers','a pea plant'],['R','round seeds','wrinkled seeds','a pea plant'],['G','green pods','yellow pods','a pea plant'],['E','free earlobes','attached earlobes','a person'],['W','a widow\'s peak','a straight hairline','a person'],['F','freckles','no freckles','a person'],['S','spots','no spots','a ladybug'],['L','long ears','short ears','a dog']];
  const cross = (L, p1, p2) => { const l = L.toLowerCase(), kids = []; for (const a of p1) for (const b of p2) kids.push(a === L || b !== L ? a + b : b + a); return kids; };
  addTo(7, 'Science', 'genetics',
    () => { const [L, dom, rec, org] = pick(TRAITS), l = L.toLowerCase(), g = pick([L + L, L + l, l + l]), ph = g === l + l ? rec : dom;
      return MQ(`In ${org}, ${L} (${dom}) is dominant over ${l} (${rec}). What phenotype does genotype ${g} have?`, ph, [ph === dom ? rec : dom, 'a mix of both traits'],
        `${g} shows ${ph}. One capital ${L} is enough to show the dominant trait (${dom}); the recessive trait (${rec}) only appears with two lowercase letters, ${l}${l}.`); },
    () => { const [L, dom, rec] = pick(TRAITS), l = L.toLowerCase(), g = pick([L + L, L + l, l + l]), ans = g[0] === g[1] ? 'homozygous' : 'heterozygous';
      return MQ(`Is the genotype ${g} (${L} = ${dom}, ${l} = ${rec}) homozygous or heterozygous?`, ans, [ans === 'homozygous' ? 'heterozygous' : 'homozygous', 'recessive only'],
        `${g} is ${ans}. Homo = same (${L}${L} or ${l}${l}); hetero = different (${L}${l}). A heterozygous ${L}${l} organism shows the dominant trait but can still pass on ${l}.`); },
    () => { const [L, dom, rec] = pick(TRAITS), l = L.toLowerCase(), gen = () => pick([L + L, L + l, l + l]), p1 = gen(), p2 = gen(), kids = cross(L, p1, p2);
      const askRec = Math.random() < .5, n = kids.filter(k => (k === l + l) === askRec).length, pct = n * 25 + '%';
      return MQ(`${L} (${dom}) is dominant over ${l} (${rec}). Cross ${p1} × ${p2}.\nWhat percent of offspring are expected to show ${askRec ? rec : dom}?`, pct, shuffle(['0%','25%','50%','75%','100%']),
        `Punnett square boxes: ${kids.join(', ')}. ${askRec ? `Only ${l}${l} shows ${rec}` : `Any box with a capital ${L} shows ${dom}`} → ${n} of 4 boxes = ${pct}.`); },
    () => { const [L] = pick(TRAITS), l = L.toLowerCase(), gen = () => pick([L + L, L + l, l + l]), p1 = gen(), p2 = gen(), kids = cross(L, p1, p2);
      const c = g => kids.filter(k => k === g).length, ratio = `${c(L + L)} ${L}${L} : ${c(L + l)} ${L}${l} : ${c(l + l)} ${l}${l}`;
      const fake = () => { let a, b; do { a = R(0, 4); b = R(0, 4 - a); } while (a + b > 4); return `${a} ${L}${L} : ${b} ${L}${l} : ${4 - a - b} ${l}${l}`; };
      return MQ(`Cross ${p1} × ${p2}. What is the expected genotype ratio out of 4 offspring?`, ratio, [fake(), fake(), fake(), fake()],
        `Fill in the Punnett square: ${p1[0]} and ${p1[1]} across the top, ${p2[0]} and ${p2[1]} down the side. The boxes are ${kids.join(', ')}, giving ${ratio}.`); },
    () => fromGroups({ inherited: ['eye color','natural hair color','the shape of your earlobes','blood type','freckles','a dog\'s fur color','a flower\'s petal color','dimples'], learned: ['riding a bike','speaking Spanish','a dog doing tricks','playing the piano','a parrot saying "hello"','knowing how to swim','a scar from an accident','reading'] },
      (label, item) => ({ q: `Which of these is ${label === 'inherited' ? 'an INHERITED trait (passed through genes)' : 'a LEARNED or acquired trait (not in genes)'}?`, explain: `${item[0].toUpperCase() + item.slice(1)} is ${label}. Inherited traits come from your parents' genes. Learned/acquired traits come from experience or practice and can't be passed on through genes.` })),
    () => { const T = [['a section of DNA that controls a trait','gene'],['different versions of a gene, like B or b','alleles'],['the letters showing which alleles an organism has','genotype'],['the physical trait you can observe','phenotype'],['an allele that hides another allele','dominant allele'],['an allele that is hidden when a dominant allele is present','recessive allele'],['having two identical alleles (BB or bb)','homozygous'],['having two different alleles (Bb)','heterozygous'],['the passing of traits from parents to offspring','heredity'],['the scientist known as the "father of genetics" who studied pea plants','Gregor Mendel'],['the molecule that carries genetic instructions','DNA'],['a structure in the nucleus made of tightly coiled DNA','chromosome']];
      return Math.random() < .5 ? fromTable(T, ([d, t]) => ({ q: `Which genetics term means ${d}?`, explain: `That's ${t}.` }))
        : fromTable(T.map(([d, t]) => [t, d]), ([t, d]) => ({ q: `In genetics, what does "${t}" mean?`, explain: `${t[0].toUpperCase() + t.slice(1)}: ${d}.` })); },
  );

  const ELEMENTS = [['lithium','Li','metal'],['beryllium','Be','metal'],['boron','B','metalloid'],['fluorine','F','nonmetal'],['phosphorus','P','nonmetal'],['argon','Ar','nonmetal'],['titanium','Ti','metal'],['chromium','Cr','metal'],['manganese','Mn','metal'],['cobalt','Co','metal'],['nickel','Ni','metal'],['bromine','Br','nonmetal'],['krypton','Kr','nonmetal'],['tin','Sn','metal'],['iodine','I','nonmetal'],['platinum','Pt','metal'],['mercury','Hg','metal'],['uranium','U','metal'],['radon','Rn','nonmetal'],['arsenic','As','metalloid'],['germanium','Ge','metalloid'],['silicon','Si','metalloid'],['sodium','Na','metal'],['carbon','C','nonmetal'],['oxygen','O','nonmetal'],['iron','Fe','metal'],['gold','Au','metal'],['helium','He','nonmetal'],['calcium','Ca','metal'],['sulfur','S','nonmetal']];
  addTo(7, 'Science', 'matter',

    () => whichGroup({

        liquid: ['has a definite volume but takes the shape of its container','particles slide past each other','orange juice','melted wax','can be poured but not squeezed smaller'],
        gas: ['has no definite shape or volume','particles move fast and spread far apart','steam','the helium in a balloon','expands to fill any container'] },
      (label, item) => ({ q: `Which state of matter matches this: ${item}?`, explain: `That's a ${label}. Solid: fixed shape and volume, particles vibrate in place. Liquid: fixed volume, takes the container's shape, particles slide. Gas: no fixed shape or volume, particles spread out to fill the container.` })),
    () => whichGroup({
        element: ['pure gold','oxygen gas','a copper wire','helium','a diamond (pure carbon)','aluminum foil'],
        compound: ['water (H₂O)','table salt (NaCl)','carbon dioxide (CO₂)','sugar','baking soda','rust (iron oxide)'],
        mixture: ['salad','trail mix','salt water','air','sand and iron filings','lemonade'] },
      (label, item) => ({ q: `Is ${item} an element, a compound, or a mixture?`, explain: `${item[0].toUpperCase() + item.slice(1)} is ${label === 'element' ? 'an element' : 'a ' + label}. Element = one kind of atom. Compound = two or more elements chemically bonded in a fixed ratio (can't be separated physically). Mixture = substances combined but not bonded, and they can be separated.` })),
    () => fromGroups({
        'chemical property': ['can burn (flammability)','reacts with acid','rusts when wet','tarnishes in air','reacts with oxygen','is poisonous'],
        'physical property': ['color','boiling point','density','hardness','shiny luster','ability to dissolve in water'] },
      (label, item) => ({ q: `Which of these is a ${label.toUpperCase()}?`, explain: `"${item}" is a ${label}. Physical properties can be observed or measured without changing what the substance is (color, density, boiling point). Chemical properties describe how a substance CHANGES into something new (burning, rusting, reacting).` })),
    () => whichGroup({
        melting: ['a chocolate bar softening in a hot car','an ice cream cone dripping','butter turning to liquid in a pan','snow turning to slush in the sun'],
        freezing: ['a pond turning to ice in winter','water in an ice cube tray becoming solid','juice turning into a popsicle','lava hardening into rock'],
        evaporation: ['a puddle disappearing on a sunny day','wet clothes drying on a line','sweat drying on your skin','water boiling away in a pot'],
        condensation: ['water droplets forming on a cold soda can','a bathroom mirror fogging up','dew forming on grass in the morning','your breath fogging a car window'],
        sublimation: ['dry ice turning straight into gas','snow disappearing on a cold, sunny day without melting','mothballs slowly shrinking in a closet'],
        deposition: ['frost forming on a window','ice crystals forming on a freezer wall from the air','snowflakes forming high in the clouds from water vapor'] },
      (label, item) => ({ q: `Which phase change is happening: ${item}?`, explain: `This is ${label}. Melting s→l, freezing l→s, evaporation l→g, condensation g→l, sublimation s→g (skipping liquid), deposition g→s (skipping liquid).` })),
    () => fromGroups({ chemical: ['a candle burning','an egg frying','a copper statue turning green','fireworks exploding','bread dough rising from yeast','a banana rotting','leaves changing color in fall','antacid fizzing in water'], physical: ['chopping carrots','melting butter','dissolving salt in water','sharpening a pencil','folding a paper airplane','freezing juice','crumpling foil','stretching a rubber band'] },
      (label, item) => ({ q: `Which of these is a ${label.toUpperCase()} change?`, explain: `${item[0].toUpperCase() + item.slice(1)} is a ${label} change. Chemical changes make new substances — look for gas, heat or light, color change, or a new smell. Physical changes only change size, shape, or state.` })),
    () => fromGroups({ matter: ['air','a drop of water','a grain of sand','a rock','your body','steam','a balloon full of helium','milk'], 'not matter': ['light','sound','heat','a thought','a shadow','music','radio waves','a feeling'] },
      (label, item) => ({ q: `Which of these ${label === 'matter' ? 'IS' : 'is NOT'} matter?`, explain: `${item[0].toUpperCase() + item.slice(1)} ${label === 'matter' ? 'is matter — it has mass and takes up space.' : 'is not matter — it has no mass and takes up no space (energy and ideas aren\'t matter).'}` })),

    () => { const E = pick([1000, 2000, 5000, 10000, 20000, 50000, 100000]), lvl = R(2, 4), ans = E / 10 ** (lvl - 1), name = ['', 'producers', 'primary consumers', 'secondary consumers', 'tertiary consumers'][lvl];
      return MQ(`Producers in an ecosystem capture ${E.toLocaleString()} units of energy. Using the 10% rule, about how much energy reaches the ${name} (level ${lvl})?`, ans.toLocaleString(), [(E / (10 * (lvl - 1))).toLocaleString(), (E * 0.9).toLocaleString(), (ans / 10).toLocaleString(), (ans * 10).toLocaleString()],

addTo(7, 'Science', 'method',
  () => { const T = [['mass','a balance','grams (g)'],['the volume of a liquid','a graduated cylinder','milliliters (mL)'],['temperature','a thermometer','degrees Celsius (°C)'],['length','a meter stick','meters (m)'],['weight (the pull of gravity)','a spring scale','newtons (N)'],['time','a stopwatch','seconds (s)']];
    const [m, tool, unit] = pick(T);
    return Math.random() < .5 ? MQ(`Which tool should you use to measure ${m}?`, tool, T.filter(t => t[1] !== tool).map(t => t[1]), `Use ${tool} to measure ${m}, recorded in ${unit}.`)
      : MQ(`Which metric unit is used to measure ${m}?`, unit, T.filter(t => t[2] !== unit).map(t => t[2]), `${cap(m)} is measured in ${unit} (using ${tool}).`); },
  () => { const [n, unit, big, small] = pick([[R(2, 9), 'km', 'm', 1000], [R(2, 9), 'm', 'cm', 100], [R(2, 9), 'L', 'mL', 1000], [R(2, 9), 'kg', 'g', 1000], [R(2, 9), 'cm', 'mm', 10]]);
    return MQ(`Convert ${n} ${unit} to ${big}.`, `${n * small} ${big}`, [`${n * small / 10} ${big}`, `${n * small * 10} ${big}`, `${n / small} ${big}`],
      `1 ${unit} = ${small} ${big}. Going to a smaller unit means you need MORE of them, so multiply: ${n} × ${small} = ${n * small} ${big}. Prefixes: kilo = 1000, centi = 1/100, milli = 1/1000.`); },
  () => { const [setup, ind, dep, ctrl] = pick([
      ['A student tests whether the color of light affects how fast plants grow.', 'the color of light', 'how fast the plants grow', 'the amount of water'],
      ['Jay tests whether the type of ball affects how high it bounces.', 'the type of ball', 'how high the ball bounces', 'the height it is dropped from'],
      ['A class tests how the amount of salt in water affects how long it takes to freeze.', 'the amount of salt', 'the time it takes to freeze', 'the freezer temperature'],
      ['Nora tests whether listening to music affects her quiz scores.', 'listening to music or not', 'the quiz scores', 'the difficulty of the quizzes'],
      ['A scientist tests how the temperature of water affects how much sugar dissolves.', 'the water temperature', 'the amount of sugar that dissolves', 'the amount of water used'],
      ['Omar tests how the number of batteries affects how bright a bulb shines.', 'the number of batteries', 'the brightness of the bulb', 'the type of bulb'],
      ['Students test whether the length of a pendulum affects how fast it swings.', 'the length of the pendulum', 'the time for each swing', 'the weight on the end'],
      ['Lily tests whether the brand of paper towel affects how much water it soaks up.', 'the brand of paper towel', 'the amount of water soaked up', 'the size of each towel']]);
    const which = pick(['independent', 'dependent', 'controlled']), ans = { independent: ind, dependent: dep, controlled: ctrl }[which];
    return MQ(`${setup}\nWhich is ${which === 'controlled' ? 'a controlled variable (kept the same)' : `the ${which} variable`}?`, ans, [ind, dep, ctrl].filter(v => v !== ans).concat(['the name of the student']),
      `Independent = what you change on purpose (${ind}). Dependent = what you measure (${dep}). Controlled = what you keep the same so the test is fair (${ctrl}).`); },
  () => whichGroup({
      'asking a question': ['"Why do some apples turn brown faster than others?"','"Does the type of soil affect plant growth?"','"What makes some paper airplanes fly farther?"'],
      'forming a hypothesis': ['"If plants get more sunlight, then they will grow taller."','"If I add salt to ice, then it will melt faster."','"If a ball is dropped from higher, then it will bounce higher."'],
      'running an experiment': ['Planting six seeds and giving each a different amount of water','Dropping the same ball from three different heights','Timing how long ice melts with and without salt'],
      'analyzing data': ['Making a line graph of plant height over four weeks','Calculating the average bounce height for each drop','Comparing melt times in a data table'],
      'drawing a conclusion': ['"The results show more sunlight made the plants grow taller."','"The data did not support my hypothesis."','"Salt made the ice melt faster, so my hypothesis was correct."'] },
    (label, item) => ({ q: `Which step of the scientific method is this?\n${item}`, explain: `This is ${label}. Order: ask a question → form a hypothesis → run an experiment → analyze data → draw a conclusion (then share results).` })),
  () => { const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], ask = pick(['max', 'change', 'trend']);
    if (ask === 'max'){
      const temps = shuffle([...Array(12)].map((_, i) => 14 + i)).slice(0, 5), max = Math.max(...temps), maxDay = days[temps.indexOf(max)];
      return MQ(`Daily high temperatures — ${days.map((d, i) => `${d}: ${temps[i]}°C`).join(', ')}.\nWhich day was warmest?`, maxDay, days.filter(d => d !== maxDay), `Scan the data for the biggest number: ${max}°C on ${maxDay}.`);
    }
    const base = R(2, 8), step = R(1, 4), vals = days.map((_, i) => base + step * i + R(0, step - 1)), table = days.map((d, i) => `${d}: ${vals[i]} cm`).join(', ');
    if (ask === 'change') return MQ(`Plant height data — ${table}.\nHow much did the plant grow from Mon to Fri?`, `${vals[4] - vals[0]} cm`, [`${vals[4]} cm`, `${vals[4] + vals[0]} cm`, `${vals[4] - vals[0] + 2} cm`], `Change = final − starting = ${vals[4]} − ${vals[0]} = ${vals[4] - vals[0]} cm.`);
    return MQ(`Plant height data — ${table}.\nWhat is the overall trend?`, 'The height increased over time', ['The height decreased over time', 'The height stayed the same', 'There is no pattern at all'], `From ${vals[0]} cm to ${vals[4]} cm, the numbers generally go up, so the plant's height increased over time. A trend is the overall direction, even if one day is a little off.`); },
);
</script>

        ['colon','The coach gave one rule: never give up.','The coach gave: one rule never give up.','The: coach gave one rule, never give up.','The coach gave one: rule never give up.'],
        ['semicolon','I wanted to go outside; however, it was raining.','I wanted to go outside; and it was raining.','I wanted; to go outside however it was raining.','I wanted to go outside, however; it was raining.'],
        ['semicolon','We visited Austin, Texas; Denver, Colorado; and Boise, Idaho.','We visited Austin; Texas, Denver; Colorado, and Boise; Idaho.','We visited; Austin, Texas, Denver, Colorado, and Boise, Idaho.','We visited Austin, Texas, Denver; Colorado; and Boise, Idaho.'],
        ['dash','My best friend — the one who moved away — is visiting.','My best friend the one — who moved away is visiting.','My — best friend the one who moved away is visiting.','My best friend the one who moved away is — visiting.'],
        ['ellipsis','"I think… maybe… we should turn back," she whispered.','"I think maybe we should… turn back… she whispered."','"I… think maybe we should turn back," she… whispered.','"…I think maybe we should turn back" she whispered…'],
        ['quotation marks','"Can you help me?" asked Jordan.','"Can you help me"? asked Jordan.','Can you help me? "asked Jordan."','"Can you help me? asked Jordan."'],
        ['quotation marks','Mom said, "Dinner is ready."','Mom said "Dinner is ready".','Mom said, "Dinner is ready".','Mom said, Dinner is "ready."'],
        ['hyphen','My brother is a well-known artist.','My brother is a well known-artist.','My brother is a-well known artist.','My brother-is a well known artist.'],
        ['apostrophe','The girls\' soccer team won its game.','The girl\'s soccer team won it\'s game.','The girls soccer team won its\' game.','The girls\'s soccer team won it\'s game.']]);
      return MQ(`Which sentence uses the ${mark} correctly?`, c, w, `"${c}" is correct. Colon: after a complete sentence, before a list or explanation. Semicolon: joins two complete sentences, or separates list items that already have commas. Dashes: set off an interruption. Ellipsis: a pause or missing words. End punctuation that belongs to the quote goes inside the quotation marks.`); },
    both([['colon (:)','introduces a list or explanation after a complete sentence'],['semicolon (;)','joins two closely related complete sentences'],['dash (—)','sets off an interruption or adds emphasis'],['ellipsis (…)','shows a pause or that words were left out'],['hyphen (-)','joins words into one describing word, like "well-known"'],['apostrophe (\')','shows possession or a contraction'],['parentheses ( )','adds extra, less important information'],['quotation marks (" ")','show someone\'s exact words']],
      ([m, j]) => ({ q: `What is the main job of the ${m}?`, explain: `The ${m} ${j}.` }), ([j, m]) => ({ q: `Which punctuation mark ${j}?`, explain: `The ${m} ${j}.` })),
  );

  const SUBJ = [['The list of chores','s'],['Each of the players','s'],['Neither of my brothers','s'],['Everybody in the stands','s'],['The team','s'],['Mathematics','s'],['The news','s'],['One of the puppies','s'],['The teacher, along with the students,','s'],['Either the cat or the dog','s'],['The boxes of cereal','p'],['Both of my parents','p'],['Several of the answers','p'],['My friends and I','p'],['The players on the team','p'],['Few of the cookies','p'],['Either the dog or the cats','p'],['The scissors','p'],['Many people in town','p'],['Jeans','p']];
  const VERBS = [['is','are','ready'],['has','have','a question'],['was','were','late'],['wants','want','pizza'],['needs','need','help'],['seems','seem','happy'],['looks','look','great'],['goes','go','outside']];
  const PRON = [['I','me','myself'],['he','him','himself'],['she','her','herself'],['we','us','ourselves'],['they','them','themselves']];
  addTo(8, 'English', 'agreement',
    () => { const [s, n] = pick(SUBJ), [v1, v2, tail] = pick(VERBS), ans = n === 's' ? v1 : v2;
      return MQ(`Choose the verb that agrees with the subject:\n"${s} ___ ${tail}."`, ans, [n === 's' ? v2 : v1],
        `"${ans}" is correct — the subject is ${n === 's' ? 'singular' : 'plural'}. Tips: ignore "of ___" and "along with ___" phrases; each/everyone/neither/one are singular; both/few/several/many are plural; with "either…or," match the noun closest to the verb; words like scissors and jeans are plural, but news and mathematics are singular.`); },
    () => { const name = pick(['Maya','Jordan','Ava','Leo','Sam','Priya']), [subj, obj, refl] = pick(PRON), role = pick(['subject', 'object', 'preposition']);
      const s = role === 'subject' ? `${name} and ___ went to the game.` : role === 'object' ? `The coach picked ${name} and ___ for the team.` : `The secret stays between ${name} and ___.`, ans = role === 'subject' ? subj : obj;
      return MQ(`Which pronoun correctly completes the sentence?\n"${s}"`, ans, [role === 'subject' ? obj : subj, refl],
        `"${ans}" is correct. Cover up "${name} and" and read it alone: ${role === 'subject' ? `"${cap(subj)} went to the game."` : role === 'object' ? `"The coach picked ${obj}."` : `"between… ${obj}."`} Subjects use I/he/she/we/they; objects (after verbs and prepositions like between, to, for) use me/him/her/us/them. Reflexive pronouns (myself) only work when the same person is the subject.`); },
    () => { const [s, c, ...w] = pick([['The committee announced ___ decision.','its','their','it\'s'],['Every dog in the shelter wagged ___ tail.','its','their','it\'s'],['The girls packed ___ bags for the trip.','their','her','its'],['Neither of the boys brought ___ jacket.','his','their','them'],['The team lost ___ first game.','its','their','it\'s'],['My parents said ___ would drive us.','they','he','it'],['The books fell off ___ shelf.','their','its','there'],['One of the cats lost ___ collar.','its','their','it\'s'],['The store changed ___ hours.','its','their','it\'s'],['Both of the girls finished ___ projects.','their','her','its'],['Sam and Leo forgot ___ lunches.','their','his','there'],['The company raised ___ prices.','its','their','it\'s']]);
      return MQ(`Which pronoun agrees with its antecedent?\n"${s}"`, c, w, `"${c}" is correct. A pronoun must match the word it refers to (its antecedent) in number. Collective nouns like team, committee, and company usually act as one group → its. "One of…" and "neither of…" are singular.`); },
    () => { const [s, c, w] = pick([['___ is calling on the phone?','Who','Whom'],['To ___ should I give this letter?','whom','who'],['___ did you invite to the party?','Whom','Who'],['The girl ___ won the race is my cousin.','who','whom'],['The man ___ we met yesterday is a pilot.','whom','who'],['___ wants to go first?','Who','Whom']]);
      return MQ(`Choose who or whom:\n"${s}"`, c, [w], `"${c}" is correct. Trick: answer the question with he or him. If "he" fits, use who (subject). If "him" fits, use whom (object) — both end in m.`); },
  );
}
</script>

<script>
// ================= MORE QUESTIONS — 8th English: literary devices, vocabulary, argument =================
{
  const DEVICES = {
    foreshadowing: ['Before the trip, Grandma warns, "Stay away from the old bridge." Later, the bridge collapses.','Dark clouds gather as the family boards the boat for a "relaxing" cruise.','The main character notices a strange crack in the dam on page one.','A fortune teller tells the hero, "Beware the one who smiles too much."'],
    flashback: ['In the middle of the championship game, the story jumps back to when Lena first learned to dribble at age six.','As he opens the old letter, the narrator remembers the summer his father left.','The detective closes her eyes and the chapter shows the night of the crime ten years earlier.','While packing, Marcus recalls the day he and his best friend built the treehouse.'],
    'dramatic irony': ['The audience knows the "friendly" neighbor is the thief, but the family invites him to dinner.','Viewers see the surprise party guests hiding, while the birthday girl complains that everyone forgot her.','We know Romeo thinks Juliet is dead, but she is only asleep.','Readers know the bridge is out, but the driver speeds toward it happily.'],
    'situational irony': ['A fire station burns down.','The class clown grows up to become a strict principal.','A marriage counselor files for divorce.','A traffic cop gets a ticket for speeding.'],
    'verbal irony': ['During a terrible storm, someone says, "Lovely weather we\'re having!"','After failing the test, Leo says, "Well, that went great."','Seeing the messy room, Mom says, "Wow, it\'s so clean in here."','A soaking wet hiker says, "I just love a little drizzle."'],
    symbolism: ['A dove appears at the end of a war story to stand for peace.','A wilting rose represents a fading friendship.','A locked door represents the secrets a character keeps.','Spring arriving at the end of the book represents a fresh start.'],
  };
  const DEV_WHY = 'Foreshadowing hints at later events. Flashback jumps back in time. Dramatic irony: the audience knows something a character doesn\'t. Situational irony: the opposite of what you\'d expect happens. Verbal irony: saying the opposite of what you mean. Symbolism: an object stands for a bigger idea.';
  addTo(8, 'English', 'literary',
    () => whichGroup(DEVICES, (label, s) => ({ q: `Which literary device is shown?\n${s}`, explain: `This is ${label}. ${DEV_WHY}` })),
    () => fromGroups(DEVICES, (label, s) => ({ q: `Which passage is an example of ${label.toUpperCase()}?`, explain: `"${s}" shows ${label}. ${DEV_WHY}` })),
    both([['a funny imitation of another work','parody'],['a long speech by one character to others','monologue'],['a speech where a character, alone, speaks their thoughts aloud','soliloquy'],['a statement that seems to contradict itself but may be true','paradox'],['two opposite words placed together, like "jumbo shrimp"','oxymoron'],['a group of lines forming a section of a poem','stanza'],['a 14-line poem with a set rhyme pattern','sonnet'],['a short story that teaches a lesson, often with animal characters','fable'],['a traditional story explaining a natural event or a culture\'s beliefs','myth'],['a feeling of tense excitement about what will happen','suspense'],['the conversation between characters','dialogue'],['a character whose traits contrast with another character\'s','foil'],['the repetition of the same beginning consonant sound','alliteration'],['the author\'s choice of words','diction']],
      ([d, t]) => ({ q: `Which literary term means ${d}?`, explain: `That's ${aan(t)}.` }), ([t, d]) => ({ q: `What is ${aan(t)}?`, explain: `${cap(aan(t))} is ${d}.` })),
    () => { const [p, c, ...w] = pick([
        ['"The creaking door slammed shut. Somewhere in the dark, something breathed."','suspenseful and eerie','cheerful and lighthearted','calm and peaceful','silly and playful'],
        ['"Confetti rained down as the whole town danced in the streets, laughing and singing."','joyful and celebratory','gloomy and sad','tense and frightening','bored and dull'],
        ['"Oh sure, because making us read 300 pages over one weekend is SUCH a fair assignment."','sarcastic','sincere and grateful','frightened','neutral and factual'],
        ['"The old dog lay by the empty chair where his owner used to sit, waiting for someone who would never come."','sad and sorrowful','humorous','angry','excited'],
        ['"Water boils at 100 degrees Celsius at sea level. At higher elevations, it boils at lower temperatures."','objective and informative','emotional','angry','nostalgic'],
        ['"I remember summers at Grandpa\'s farm — warm peaches, fireflies, and the smell of fresh hay."','nostalgic and warm','fearful','sarcastic','impatient'],
        ['"How dare they cut down the only park in our neighborhood without even asking us!"','angry and outraged','calm','amused','hopeful'],
        ['"Tomorrow is a new day, and with hard work, anything is possible."','hopeful and encouraging','hopeless','bitter','confused']]);
      return MQ(`What is the tone or mood of this passage?\n${p}`, c, w, `The tone is ${c}. Look at word choice: specific words (creaking, confetti, SUCH a fair) signal the author's attitude and the feeling the passage creates.`); },
  );

  const ROOTS = [['aud','hear','audience'],['bene','good','benefit'],['cent','hundred','century'],['circum','around','circumference'],['cred','believe','incredible'],['duc / duct','lead','conductor'],['fract','break','fracture'],['gen','birth or kind','generation'],['hydr','water','hydrant'],['ject','throw','reject'],['jud','judge','judicial'],['log / logy','word or study of','biology'],['luc / lum','light','illuminate'],['man / manu','hand','manual'],['mem','remember','memory'],['meter','measure','thermometer'],['micro','small','microscope'],['min','small or less','minimum'],['mit / miss','send','transmit'],['mort','death','mortal'],['path','feeling or suffering','sympathy'],['ped','foot','pedal'],['phil','love','philosophy'],['phobia','fear','claustrophobia'],['poly','many','polygon'],['psych','mind','psychology'],['scope','look at or view','periscope'],['scrib / script','write','describe'],['sol','sun or alone','solar'],['son','sound','sonic'],['tract','pull or drag','tractor'],['vid / vis','see','visible'],['voc / vok','voice or call','vocal'],['auto','self','automatic']];
  const NUMS = [['mono / uni','one','monorail, unicycle'],['bi','two','bicycle'],['tri','three','triangle'],['quad','four','quadrilateral'],['pent','five','pentagon'],['hex','six','hexagon'],['oct','eight','octopus'],['dec','ten','decade'],['cent','hundred','centipede'],['kilo','thousand','kilometer']];
  addTo(8, 'English', 'vocab',
    () => { const [r, m, ex] = pick(ROOTS);
      return Math.random() < .5 ? MQ(`What does the root "${r}" mean, as in "${ex}"?`, m, shuffle(ROOTS.filter(x => x[1] !== m)).slice(0, 3).map(x => x[1]), `"${r}" means "${m}," so "${ex}" is connected to "${m}."`)
        : MQ(`Which root means "${m}"?`, r, shuffle(ROOTS.filter(x => x[0] !== r)).slice(0, 3).map(x => x[0]), `"${r}" means "${m}" — as in "${ex}."`); },
    () => { const [r, m, ex] = pick(NUMS);
      return Math.random() < .5 ? MQ(`What number does "${r}" stand for, as in ${ex}?`, m, NUMS.filter(x => x[1] !== m).map(x => x[1]).sort(() => Math.random() - .5).slice(0, 3), `"${r}" = ${m}.`)
        : MQ(`Which prefix means "${m}"?`, r, NUMS.filter(x => x[0] !== r).map(x => x[0]).sort(() => Math.random() - .5).slice(0, 3), `"${r}" means ${m}, as in ${ex}.`); },
    () => { const [w, m, ...wr] = pick([['audible','loud enough to be heard','easy to see','able to be touched','quick to move'],['credible','believable','incredible','impossible','forgettable'],['benevolent','kind and wanting to do good','evil','very loud','hard to believe'],['circumnavigate','sail all the way around','sail under','sail backward','stay in one place'],['fragile','easily broken','very strong','heavy','soft'],['dehydrated','lacking water','full of water','very hot','very tired'],['illuminate','light up','darken','measure','remember'],['manuscript','a document written by hand','a picture','a machine','a speech'],['memorable','easy to remember','easy to lose','hard to hear','full of light'],['immortal','living forever','very old','afraid of death','very small'],['empathy','understanding others\' feelings','fear of others','love of books','a type of illness'],['philanthropist','a person who gives to help others','a person who hates others','a scientist','a mapmaker'],['polygon','a shape with many sides','a shape with one side','a round shape','a 3-D shape'],['psychology','the study of the mind','the study of life','the study of rocks','the study of stars'],['inscription','words written or carved on something','a loud sound','a type of map','a long journey'],['solitary','alone','sunny','sad','noisy'],['traction','the grip that pulls without slipping','a loud noise','a way to see','a type of light'],['visionary','able to see and plan for the future','hard to see','afraid of the dark','very loud'],['advocate','to speak in support of','to stay silent','to throw away','to measure'],['contradict','to say the opposite','to agree completely','to write down','to pull apart']]);
      return MQ(`Use roots to figure it out: what does "${w}" most likely mean?`, m, wr, `"${w}" means "${m}." Find the root you know inside the word, then think about what the prefix or suffix adds.`); },
    () => { const [a, c, ...w] = pick([['puppy : dog :: kitten : ___','cat','mouse','bark','whisker'],['hot : cold :: tall : ___','short','high','warm','giant'],['pen : write :: knife : ___','cut','fork','sharp','kitchen'],['bird : flock :: fish : ___','school','water','fin','ocean'],['page : book :: brick : ___','wall','clay','heavy','red'],['doctor : hospital :: teacher : ___','school','student','lesson','book'],['glove : hand :: sock : ___','foot','shoe','wool','leg'],['author : novel :: composer : ___','symphony','piano','painting','poem'],['seed : tree :: egg : ___','bird','nest','shell','yolk'],['hungry : eat :: tired : ___','sleep','yawn','bed','night'],['thermometer : temperature :: scale : ___','weight','height','time','distance'],['caterpillar : butterfly :: tadpole : ___','frog','fish','pond','lizard'],['ancient : modern :: expand : ___','shrink','grow','old','wide'],['chapter : book :: scene : ___','play','actor','stage','curtain'],['cow : herd :: wolf : ___','pack','den','howl','forest']]);
      return MQ(`Complete the analogy:\n${a}`, c, w, `${a.replace('___', c)}. Figure out the relationship in the first pair (part-to-whole, opposite, tool-to-use, young-to-adult, group name…), then find the word with the SAME relationship.`); },
    () => { const [pos, neu, neg] = pick([['determined','persistent','pigheaded'],['frugal','economical','stingy'],['assertive','direct','pushy'],['inquisitive','curious','prying'],['svelte','slim','scrawny'],['fragrance','odor','stink'],['vintage','old','outdated'],['unwavering','firm','inflexible'],['bold','daring','reckless'],['easygoing','relaxed','careless'],['cozy','small','cramped'],['collector','saver','hoarder'],['discuss','talk','gossip'],['modest','quiet','timid'],['spirited','energetic','hyper']]);
      const kind = pick(['POSITIVE', 'NEGATIVE']), ans = kind === 'POSITIVE' ? pos : neg;
      return MQ(`These words have similar meanings. Which has the most ${kind} connotation?`, ans, [neu, kind === 'POSITIVE' ? neg : pos], `"${pos}" sounds positive, "${neu}" is more neutral, and "${neg}" sounds negative. Same basic meaning (denotation), different feeling (connotation).`); },
  );

  const FALL = {
    'ad hominem (attacking the person)': ['"Don\'t listen to Sam\'s idea about recycling — he can\'t even keep his room clean."','"Why trust her opinion on homework? She\'s just a kid."','"The senator wants a new park, but he dresses badly, so it\'s probably a bad idea."','"You\'re wrong about the movie because you\'re annoying."'],
    'bandwagon': ['"Everyone at school has these sneakers, so you should buy them too."','"Millions of people use this app, so it must be the best."','"All the cool kids are joining the club — don\'t be left out!"','"Nine out of ten families are switching to Brand X. Join them!"'],
    'either-or (false choice)': ['"Either you join the soccer team, or you don\'t care about your health."','"You\'re either with us or against us."','"If you don\'t buy this phone, you\'ll be left behind forever."','"Either we ban phones completely, or students will never learn anything."'],
    'hasty generalization': ['"I met two rude people from that city, so everyone there must be rude."','"My cousin\'s electric car broke down, so electric cars are unreliable."','"I didn\'t like the first chapter, so the whole series is terrible."','"Our team lost the first game, so we\'ll lose every game this season."'],
    'slippery slope': ['"If we let students chew gum in class, soon they\'ll be throwing food and the school will be chaos."','"If you skip one day of practice, you\'ll end up quitting the team."','"If we raise the price of lunch by a dime, soon no one will be able to afford food."','"If I let you stay up late tonight, you\'ll want to stay up all night every night."'],
    'appeal to celebrity': ['"A famous rapper drinks this sports drink, so it must make you a better athlete."','"This movie star uses our toothpaste — it must be the best."','"A pro basketball player says this cereal is healthy, so it must be."','"My favorite YouTuber says this diet works, so it\'s true."'],
  };
  addTo(8, 'English', 'argument',
    () => whichGroup(FALL, (label, s) => ({ q: `Which faulty reasoning (fallacy) is used?\n${s}`, explain: `This is ${label}. A fallacy is a mistake in reasoning that makes an argument seem stronger than it is. Strong arguments rely on relevant evidence instead.` })),
    () => fromGroups(FALL, (label, s) => ({ q: `Which statement is an example of ${label.toUpperCase()}?`, explain: `${s} is ${label}.` })),
    () => { const essays = [
        { claim: 'Schools should start at 8:30 a.m. or later.', counter: 'Some parents say later start times make it harder to get to work on time.', rebuttal: 'However, many districts solved this with before-school programs, and students\' health matters more.', evidence: 'Sleep experts report that teens who get more sleep have better attention and grades.' },
        { claim: 'Our town should build a skate park.', counter: 'Critics argue a skate park would cost too much money.', rebuttal: 'Yet the park could be paid for with grants and would save money by reducing skating on busy streets.', evidence: 'A survey of local teens found most would use a skate park at least once a week.' },
        { claim: 'Students should be allowed to use phones at lunch.', counter: 'Some teachers worry phones cause students to ignore each other.', rebuttal: 'But lunch is already social time, and phones can help students stay in touch with family.', evidence: 'At a nearby school that allowed phones at lunch, reported discipline problems did not increase.' },
        { claim: 'Every student should learn a second language.', counter: 'Others say students should focus on core subjects like math instead.', rebuttal: 'However, learning a language can actually improve problem-solving skills used in math.', evidence: 'Studies show bilingual students often score higher on tests of mental flexibility.' },
      ];
      const e = pick(essays), part = pick(['claim', 'counter', 'rebuttal', 'evidence']), names = { claim: 'claim', counter: 'counterclaim', rebuttal: 'rebuttal', evidence: 'evidence' };
      return MQ(`In an argument essay, what role does this sentence play?\n"${e[part]}"`, names[part], Object.values(names).filter(n => n !== names[part]),
        `It's the ${names[part]}. Claim = the writer's position. Evidence = facts or data that support it. Counterclaim = the opposing view. Rebuttal = the writer's answer to the counterclaim (often starts with "however" or "but").`); },
    () => fromGroups({ 'more reliable': ['a government health website (.gov) updated this year','an article in a well-known science magazine written by an expert','a university research study (.edu) with cited data','an encyclopedia entry reviewed by editors','a museum\'s official website','a recent news report that names its sources'], 'less reliable': ['an anonymous post on a social media site','a blog with no author and no sources','a website trying to sell the product it reviews','a 20-year-old article about current technology','a comment section under a video','a site with lots of pop-up ads and no author listed'] },
      (label, item) => ({ q: `For a research paper, which source is ${label.toUpperCase()}?`, explain: `${cap(item)} is ${label}. Check the author's expertise, the date, whether sources are cited, and whether the site is trying to sell you something.` })),
  );
}
</script>

<script>
// ================= MORE QUESTIONS — 8th Science: atoms, energy, forces, reactions =================
{
  const PT = [['hydrogen','H',1,1],['helium','He',2,4],['lithium','Li',3,7],['beryllium','Be',4,9],['boron','B',5,11],['carbon','C',6,12],['nitrogen','N',7,14],['oxygen','O',8,16],['fluorine','F',9,19],['neon','Ne',10,20],['sodium','Na',11,23],['magnesium','Mg',12,24],['aluminum','Al',13,27],['silicon','Si',14,28],['phosphorus','P',15,31],['sulfur','S',16,32],['chlorine','Cl',17,35],['argon','Ar',18,40],['potassium','K',19,39],['calcium','Ca',20,40]];
  addTo(8, 'Science', 'atoms',
    () => { const [n, s, Z] = pick(PT);
      return Math.random() < .5 ? MQ(`What is the atomic number of ${n} (${s})?`, Z, [Z + 1, Z * 2, Math.max(1, Z - 1)], `${cap(n)} has atomic number ${Z}, meaning every ${n} atom has ${Z} protons.`)
        : MQ(`Which element has atomic number ${Z}?`, `${n} (${s})`, shuffle(PT.filter(p => Math.abs(p[2] - Z) <= 3 && p[2] !== Z)).slice(0, 3).map(p => `${p[0]} (${p[1]})`), `Atomic number ${Z} = ${Z} protons = ${n}. The periodic table is ordered by atomic number.`); },
    () => { const [n, s, Z, A0] = pick(PT), A = A0 + R(-1, 2) || A0, N = A - Z;
      return MQ(`An isotope of ${n} has a mass number of ${A}. How many neutrons does it have?`, N, [A, Z, A + Z], `Neutrons = mass number − atomic number = ${A} − ${Z} = ${N}. Isotopes of ${n} always have ${Z} protons, but the number of neutrons can vary.`); },
    () => { const [n, s, Z] = pick(PT.filter(p => p[2] > 2)), ch = pick([-2, -1, 1, 2]), e = Z - ch, sign = ch > 0 ? `${ch === 1 ? '' : ch}+` : `${ch === -1 ? '' : -ch}−`;
      return MQ(`A ${n} atom ${ch > 0 ? `loses ${ch}` : `gains ${-ch}`} electron${Math.abs(ch) > 1 ? 's' : ''}. How many electrons does the ion have, and what is its charge?`, `${e} electrons, ${sign}`, [`${Z + ch} electrons, ${sign}`, `${e} electrons, ${ch > 0 ? `${ch === 1 ? '' : ch}−` : `${ch === -1 ? '' : -ch}+`}`, `${Z} electrons, neutral`],
        `A neutral ${n} atom has ${Z} electrons. ${ch > 0 ? `Losing ${ch} leaves ${e}` : `Gaining ${-ch} makes ${e}`}. Now there are ${Z} protons (+) and ${e} electrons (−), so the charge is ${sign}. Losing electrons → positive; gaining → negative.`); },
    both([['a vertical column on the periodic table','group (family)'],['a horizontal row on the periodic table','period'],['the scientist who organized the first periodic table','Dmitri Mendeleev'],['very stable elements in the last column that rarely react','noble gases'],['very reactive metals in the first column, like sodium','alkali metals'],['reactive nonmetals in group 17, like chlorine','halogens'],['atoms of the same element with different numbers of neutrons','isotopes'],['an atom that has gained or lost electrons','ion'],['electrons in the outermost shell that take part in bonding','valence electrons'],['the weighted average mass of an element\'s atoms','atomic mass'],['positively charged particles in the nucleus','protons'],['particles with no charge in the nucleus','neutrons'],['negatively charged particles outside the nucleus','electrons']],
      ([d, t]) => ({ q: `What is ${d} called?`, explain: `That's the ${t}.` }), ([t, d]) => ({ q: `What does "${t}" mean?`, explain: `${cap(t)}: ${d}.` })),
    () => whichGroup({ 'alkali metals': ['lithium','sodium','potassium','rubidium'], 'alkaline earth metals': ['beryllium','magnesium','calcium'], halogens: ['fluorine','chlorine','bromine','iodine'], 'noble gases': ['helium','neon','argon','krypton'] },
      (label, item) => ({ q: `Which group (family) does ${item} belong to?`, explain: `${cap(item)} is one of the ${label}. Elements in the same group have the same number of valence electrons, so they react in similar ways. Alkali metals (group 1) are super reactive; noble gases (group 18) barely react at all.` })),
  );

  const EM = [['radio waves','radio and TV broadcasts'],['microwaves','cooking food and cell phone signals'],['infrared waves','heat you feel and TV remote controls'],['visible light','the only waves human eyes can see'],['ultraviolet (UV) rays','sunburns and killing germs'],['X-rays','taking pictures of bones'],['gamma rays','the highest-energy waves, used to treat cancer']];
  addTo(8, 'Science', 'energy',
    both(EM, ([w, u]) => ({ q: `Which use or fact matches ${w}?`, explain: `${cap(w)}: ${u}. Order from longest wavelength (lowest energy) to shortest (highest energy): radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.` }), ([u, w]) => ({ q: `Which type of electromagnetic wave is known for ${u}?`, explain: `${cap(w)} — ${u}.` })),
    () => { let i, j; do { i = R(0, 6); j = R(0, 6); } while (i === j); const [a, b] = [EM[i][0], EM[j][0]], ask = pick(['higher frequency', 'longer wavelength', 'more energy']), hi = i > j ? a : b, lo = i > j ? b : a, ans = ask === 'longer wavelength' ? lo : hi;
      return MQ(`Which has ${ask}: ${a} or ${b}?`, ans, [ans === a ? b : a], `Order: radio → microwaves → infrared → visible → UV → X-rays → gamma. Moving right, frequency and energy go UP and wavelength gets SHORTER. So ${ans} has ${ask}.`); },
    () => fromTable([['a toaster','electrical → thermal'],['a solar panel','light (radiant) → electrical'],['a wind turbine','mechanical → electrical'],['a person eating breakfast, then running','chemical → mechanical'],['a speaker playing music','electrical → sound'],['rubbing your hands together','mechanical → thermal'],['a plant doing photosynthesis','light (radiant) → chemical'],['a microphone','sound → electrical'],['a battery powering a toy car','chemical → electrical → mechanical'],['a campfire','chemical → thermal and light'],['a hydroelectric dam','mechanical → electrical'],['a hair dryer','electrical → thermal and mechanical']],
      ([d, t]) => ({ q: `What energy transformation happens in ${d}?`, explain: `${cap(d)}: ${t}. Energy is never created or destroyed — it only changes form (Law of Conservation of Energy).` })),
    () => { const G = { renewable: ['solar','wind','hydroelectric (moving water)','geothermal (Earth\'s heat)','biomass (plants and wood)'], nonrenewable: ['coal','oil (petroleum)','natural gas','nuclear (uranium)'] };
      return Math.random() < .5 ? whichGroup(G, (label, item) => ({ q: `Is ${item} energy renewable or nonrenewable?`, explain: `${cap(item)} is ${label}. Renewable resources are replaced naturally in a human lifetime. Nonrenewable resources take millions of years to form or are limited (fossil fuels, uranium).` }))
        : fromGroups(G, (label, item) => ({ q: `Which energy source is ${label.toUpperCase()}?`, explain: `${cap(item)} is ${label}.` })); },
    () => { const m = R(1, 10), v = R(2, 12), KE = m * v * v / 2;
      return MQ(`A ${m} kg ball moves at ${v} m/s. What is its kinetic energy? (KE = ½mv²)`, fmt(KE) + ' J', [m * v + ' J', fmt(m * v / 2) + ' J', m * v * v + ' J'], `KE = ½ × m × v² = ½ × ${m} × ${v}² = ½ × ${m} × ${v * v} = ${fmt(KE)} joules. Square the speed first — doubling speed makes KE four times bigger.`); },
    () => { const m = R(1, 20), h = R(2, 30), PE = m * 10 * h;
      return MQ(`A ${m} kg box sits on a shelf ${h} m high. What is its gravitational potential energy? (PE = mgh, use g = 10 m/s²)`, PE + ' J', [m * h + ' J', m + 10 + h + ' J', PE * 10 + ' J'], `PE = m × g × h = ${m} × 10 × ${h} = ${PE} joules. Higher and heavier objects store more potential energy.`); },
    () => { const f = R(2, 50), wl = R(1, 20), v = f * wl, ask = pick(['speed', 'frequency']);
      return ask === 'speed' ? MQ(`A wave has a frequency of ${f} Hz and a wavelength of ${wl} m. What is its speed?`, v + ' m/s', [f + wl + ' m/s', fmt(f / wl) + ' m/s', v * 2 + ' m/s'], `Wave speed = frequency × wavelength = ${f} × ${wl} = ${v} m/s.`)
        : MQ(`A wave travels at ${v} m/s with a wavelength of ${wl} m. What is its frequency?`, f + ' Hz', [v * wl + ' Hz', v - wl + ' Hz', wl + ' Hz'], `Frequency = speed ÷ wavelength = ${v} ÷ ${wl} = ${f} Hz.`); },
    () => whichGroup({ conduction: ['a metal slide getting hot in the sun and burning your legs','heat moving from a hot pan into its handle','ice melting when you hold it','a cold floor making your feet cold'], convection: ['hot air balloons rising','warm water rising in a pot while cooler water sinks','a radiator warming a whole room by moving air','wind created by uneven heating of air'], radiation: ['sunlight warming the Earth through space','feeling warmth from a heat lamp','a microwave heating food','warmth from a fireplace across the room'] },
      (label, item) => ({ q: `Which type of heat transfer is this: ${item}?`, explain: `This is ${label}. Conduction = direct contact. Convection = currents in liquids or gases. Radiation = electromagnetic waves, no contact or medium needed.` })),
  );

  addTo(8, 'Science', 'forces',
    () => { const a = R(5, 40), b = R(5, 40), same = Math.random() < .5, net = same ? a + b : Math.abs(a - b), dir = same ? 'right' : a > b ? 'right' : a < b ? 'left' : 'no direction';
      return MQ(`One force of ${a} N pushes a box to the right. Another force of ${b} N pushes ${same ? 'right' : 'left'}. What is the net force?`, net === 0 ? '0 N (balanced)' : `${net} N ${dir}`, [same ? `${Math.abs(a - b)} N right` : `${a + b} N right`, net === 0 ? `${a} N right` : `${net} N ${dir === 'right' ? 'left' : 'right'}`, '0 N (balanced)'],
        `Forces in the same direction ADD; opposite directions SUBTRACT. ${same ? `${a} + ${b} = ${net} N right.` : `${Math.max(a, b)} − ${Math.min(a, b)} = ${net} N toward the bigger force.`} ${net === 0 ? 'Equal and opposite forces are balanced, so motion does not change.' : 'Unbalanced forces change an object\'s motion.'}`); },
    () => { const v1 = R(0, 10), dv = R(2, 20), t = R(2, 8), v2 = v1 + dv * t, acc = dv;
      return MQ(`A car speeds up from ${v1} m/s to ${v2} m/s in ${t} seconds. What is its acceleration?`, acc + ' m/s²', [fmt(v2 / t) + ' m/s²', v2 - v1 + ' m/s²', fmt((v2 - v1) * t) + ' m/s²'], `Acceleration = change in velocity ÷ time = (${v2} − ${v1}) ÷ ${t} = ${v2 - v1} ÷ ${t} = ${acc} m/s².`); },
    () => { const [q, c, ...w] = pick([
        ['What is the difference between speed and velocity?','Velocity includes direction; speed does not','They are exactly the same','Speed includes direction; velocity does not','Velocity is always faster'],
        ['Which force slows down a sliding hockey puck?','friction','gravity pushing it forward','magnetism','inertia'],
        ['What happens to the gravitational pull between two objects as they move farther apart?','It gets weaker','It gets stronger','It stays the same','It turns into friction'],
        ['Which has more inertia?','a loaded truck','a bicycle','a tennis ball','a feather'],
        ['Why do astronauts weigh less on the Moon?','The Moon has less mass, so its gravity is weaker','They lose mass in space','There is no gravity on the Moon','Their muscles get stronger'],
        ['What is a balanced force?','Equal forces in opposite directions that cause no change in motion','Any force that makes an object speed up','A force that only acts on heavy objects','Two forces in the same direction'],
        ['Which is an example of acceleration?','a car turning a corner at a constant speed','a book sitting on a desk','a car parked in a lot','a train moving in a straight line at a steady 50 mph'],
        ['How can you reduce friction?','Add oil or use wheels','Make the surface rougher','Push down harder','Add sand to the surface'],
        ['A bowling ball and a marble are dropped at the same time with no air resistance. Which lands first?','They land at the same time','the bowling ball','the marble','it depends on the color'],
        ['What unit is force measured in?','newtons (N)','meters per second','kilograms','joules']]);
      return MQ(q, c, w, `Answer: ${c}. Remember: velocity = speed + direction; acceleration is any change in speed OR direction; friction opposes motion; gravity depends on mass and distance; more mass = more inertia.`); },
  );

  addTo(8, 'Science', 'reactions',
    () => { const pH = R(0, 14), kind = pH < 7 ? 'acidic' : pH > 7 ? 'basic' : 'neutral';
      return MQ(`A solution has a pH of ${pH}. Is it acidic, basic, or neutral?`, kind, ['acidic','basic','neutral'].filter(k => k !== kind), `pH below 7 = acid, exactly 7 = neutral (pure water), above 7 = base. The farther from 7, the stronger the acid or base.`); },
    () => whichGroup({ acid: ['lemon juice','vinegar','orange juice','stomach acid','soda'], base: ['baking soda dissolved in water','soap','bleach','ammonia cleaner','antacid tablets'], neutral: ['pure water','table salt dissolved in water'] },
      (label, item) => ({ q: `Is ${item} usually an acid, a base, or neutral?`, explain: `${cap(item)} is ${label === 'neutral' ? 'neutral' : 'a ' + label}. Acids taste sour and have pH below 7. Bases feel slippery, taste bitter, and have pH above 7. Never taste lab chemicals!` })),
    () => whichGroup({ exothermic: ['a campfire burning','fireworks exploding','a hand warmer heating up','cellular respiration in your body','burning gasoline in a car engine'], endothermic: ['an instant cold pack getting cold','photosynthesis using sunlight','baking soda and vinegar making the cup feel colder','cooking an egg (it absorbs heat)','melting ice'] },
      (label, item) => ({ q: `Is this exothermic or endothermic: ${item}?`, explain: `It's ${label}. Exothermic releases energy (it feels warm — "exit"). Endothermic absorbs energy (it feels cold — "enter").` })),
    () => { const [eq, bal, note] = pick([['H₂ + O₂ → H₂O', false, '2 O on the left but only 1 on the right. Balanced: 2H₂ + O₂ → 2H₂O'],['2H₂ + O₂ → 2H₂O', true, '4 H and 2 O on each side'],['CH₄ + 2O₂ → CO₂ + 2H₂O', true, '1 C, 4 H, and 4 O on each side'],['CH₄ + O₂ → CO₂ + H₂O', false, '2 O on the left but 3 on the right, and 4 H on the left but 2 on the right'],['Na + Cl₂ → NaCl', false, '2 Cl on the left but only 1 on the right. Balanced: 2Na + Cl₂ → 2NaCl'],['2Na + Cl₂ → 2NaCl', true, '2 Na and 2 Cl on each side'],['N₂ + 3H₂ → 2NH₃', true, '2 N and 6 H on each side'],['N₂ + H₂ → NH₃', false, '2 N on the left but 1 on the right'],['C + O₂ → CO₂', true, '1 C and 2 O on each side'],['Fe + O₂ → Fe₂O₃', false, 'Fe and O counts don\'t match. Balanced: 4Fe + 3O₂ → 2Fe₂O₃']]);
      return MQ(`Is this chemical equation balanced?\n${eq}`, bal ? 'Yes, it is balanced' : 'No, it is not balanced', [bal ? 'No, it is not balanced' : 'Yes, it is balanced'], `${bal ? 'Balanced' : 'Not balanced'}: ${note}. A balanced equation has the same number of each type of atom on both sides — that's the Law of Conservation of Mass.`); },
    () => { const m = R(10, 200), v = pick([5, 10, 20, 25, 50]), d = +(m / v).toFixed(2), sub = [['water', 1], ['vegetable oil', 0.92], ['honey', 1.42], ['corn syrup', 1.33]];
      const [liq, ld] = pick(sub), sinks = d > ld;
      if (Math.abs(d - ld) < 0.05) return MQ(`An object has a mass of 30 g and a volume of 60 cm³. Will it sink or float in water (density 1 g/cm³)?`, 'float', ['sink'], 'Density = 30 ÷ 60 = 0.5 g/cm³, which is less than water\'s 1 g/cm³, so it floats.');
      return MQ(`An object has a mass of ${m} g and a volume of ${v} cm³. Will it sink or float in ${liq} (density ${ld} g/cm³)?`, sinks ? 'sink' : 'float', [sinks ? 'float' : 'sink'], `Object density = ${m} ÷ ${v} = ${fmt(d)} g/cm³. Compare to ${liq} (${ld} g/cm³): ${sinks ? 'the object is denser, so it sinks' : 'the object is less dense, so it floats'}.`); },
  );
}
</script>

<script>
// ================= MORE QUESTIONS — 8th Science: evolution & earth/space =================
{
  const EVID = { 'fossil record': ['Rock layers show simple organisms in older layers and more complex ones in newer layers.','Fossils show whales once had small back legs.','A series of fossils shows horses gradually getting larger over millions of years.'], 'homologous structures': ['A human arm, a bat wing, and a whale flipper have the same bone pattern.','Cats, dogs, and humans all have similar leg bones arranged the same way.','Bird wings and lizard front legs share the same basic bones.'], 'embryology': ['Early fish, chicken, and human embryos all have similar tail and gill-like structures.','Embryos of many vertebrates look very similar in their earliest stages.'], 'DNA comparisons': ['Humans and chimpanzees share about 98% of their DNA.','Scientists compare gene sequences to see which species are most closely related.'], 'vestigial structures': ['Whales have tiny hip bones they no longer use.','Humans have a tailbone but no tail.','Some snakes have tiny leftover leg bones.'] };
  const ADAPT = { structural: ['a duck\'s webbed feet','a polar bear\'s thick fur','a cactus\'s spines','a giraffe\'s long neck','a hawk\'s sharp talons'], behavioral: ['birds migrating south for the winter','bears hibernating','wolves hunting in packs','a possum playing dead','turtles basking in the sun to warm up'], physiological: ['a snake making venom','a frog\'s body slowing down while frozen in winter','a camel\'s body saving water','a skunk producing a bad smell','an octopus changing color'] };

    both([['a trait that helps an organism survive in its environment','adaptation'],['a change in an organism\'s DNA','mutation'],['the change in species over many generations','evolution'],['the process where organisms better suited to their environment survive and reproduce more','natural selection'],['people breeding plants or animals to get certain traits','artificial selection'],['preserved remains or traces of ancient organisms','fossils'],['when every member of a species has died','extinction'],['similar body parts inherited from a common ancestor','homologous structures'],['body parts that have lost most or all of their original use','vestigial structures'],['the scientist who proposed evolution by natural selection','Charles Darwin'],['the islands where Darwin studied finches with different beaks','the Galápagos Islands'],['a group of organisms that can breed and produce fertile offspring','species'],['differences among individuals of the same species','variation'],['the principle that lower rock layers are usually older than the layers above','law of superposition']],
      ([d, t]) => ({ q: `Which term means ${d}?`, explain: `That's ${t}.` }), ([t, d]) => ({ q: `What does "${t}" mean?`, explain: `${cap(t)}: ${d}.` })),
    () => { const [s, c, ...w] = pick([
        ['In a forest with dark tree bark, dark moths are harder for birds to see than light moths. Over many generations, what will likely happen?','Dark moths will become more common','Light moths will become more common','All moths will turn white','Birds will stop eating moths'],
        ['Bacteria are treated with an antibiotic. A few have a mutation that resists it. What will the next generations look like?','Most bacteria will be resistant','All bacteria will die','Bacteria will become larger','Nothing will change'],
        ['On an island with only hard nuts to eat, finches with thick, strong beaks survive better. Over time:','More finches will have thick beaks','Finches will grow thin beaks','Finches will stop eating nuts','Beak size will stay random'],
        ['A population of rabbits lives where snow covers the ground most of the year. Which trait will likely increase?','White fur','Brown fur','Long tails','Shorter ears'],
        ['Giraffes with longer necks reach more leaves in a drought. What does natural selection predict?','Longer necks become more common over generations','Giraffes will stretch their necks and pass it on','All giraffes will die','Neck length won\'t matter'],
        ['Farmers keep breeding only the cows that give the most milk. This is an example of:','artificial selection','natural selection','extinction','a mutation']]);
      return MQ(s, c, w, `Answer: ${c}. Organisms don't choose to change. Individuals with helpful traits survive and reproduce more, passing those traits on, so the population slowly changes.`); },
    () => { const fossils = shuffle(['trilobite', 'fern', 'fish', 'dinosaur', 'mammoth', 'ammonite', 'clam']).slice(0, 4), asc = pick([true, false]);
      const layers = fossils.map((f, i) => `Layer ${String.fromCharCode(65 + i)} (${i === 0 ? 'top' : i === 3 ? 'bottom' : 'middle'}): ${f} fossils`);
      return asc ? MQ(`Undisturbed rock layers:\n${layers.join('\n')}\nWhich fossils are the OLDEST?`, fossils[3], fossils.slice(0, 3), `By the law of superposition, lower layers formed first, so the bottom layer (D: ${fossils[3]}) holds the oldest fossils.`)
        : MQ(`Undisturbed rock layers:\n${layers.join('\n')}\nWhich fossils are the YOUNGEST?`, fossils[0], fossils.slice(1), `By the law of superposition, the top layer formed last, so layer A (${fossils[0]}) holds the youngest fossils.`); },

  const PHASES = ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'third quarter', 'waning crescent'];

  addTo(8, 'Science', 'earthspace',
    () => { const i = R(0, 7);

    both([['we can\'t see the lit side because it faces away from Earth','new moon'],['the entire side facing Earth is lit','full moon'],['a small sliver is lit and it\'s growing each night','waxing crescent'],['more than half is lit and it\'s shrinking','waning gibbous'],['half of the visible side is lit, about a week after the new moon','first quarter'],['half of the visible side is lit, about a week after the full moon','third quarter']],
      ([d, p]) => ({ q: `Which moon phase is it when ${d}?`, explain: `That's the ${p}. The Moon doesn't make light — we see the part lit by the Sun, which changes as it orbits Earth.` }), ([p, d]) => ({ q: `What do we see during a ${p}?`, explain: `During a ${p}, ${d}.` })),

        : fromGroups(G, (label, item) => ({ q: `Which statement is true about a ${label.toUpperCase()}?`, explain: `In a ${label}, ${item}.` })); },

      return Math.random() < .5 ? MQ(`Which planet is closer to the Sun: ${PLANETS[i]} or ${PLANETS[j]}?`, PLANETS[Math.min(i, j)], [PLANETS[Math.max(i, j)]], `Order from the Sun: ${PLANETS.join(', ')}. ${PLANETS[Math.min(i, j)]} is planet #${Math.min(i, j) + 1}; ${PLANETS[Math.max(i, j)]} is #${Math.max(i, j) + 1}.`)
        : MQ(`Which planet is number ${i + 1} from the Sun?`, PLANETS[i], shuffle(PLANETS.filter((_, k) => k !== i)).slice(0, 3), `Order: ${PLANETS.map((p, k) => `${k + 1}. ${p}`).join(', ')}. Memory trick: "My Very Educated Mother Just Served Us Noodles."`); },
    () => { const G = { 'inner (rocky) planets': ['Mercury','Venus','Earth','Mars'], 'outer (gas and ice giant) planets': ['Jupiter','Saturn','Uranus','Neptune'] };
      return Math.random() < .5 ? whichGroup(G, (label, p) => ({ q: `Is ${p} one of the inner or outer planets?`, explain: `${p} is one of the ${label}. The asteroid belt separates the small, rocky inner planets from the huge outer giants.` }))

      return MQ(q, c, w, `Answer: ${c}. Gravity holds the solar system together; the Sun is an ordinary star in the Milky Way galaxy.`); },
  );
}
</script>

<script>

{

  addTo(8, 'Social Studies', 'founding',
    both([['led the Sons of Liberty and organized protests in Boston','Samuel Adams'],['declared, "Give me liberty, or give me death!"','Patrick Henry'],['won French support for the war as a diplomat in Paris','Benjamin Franklin'],['defended British soldiers in court and later became the second President','John Adams'],['plotted to hand West Point over to the British','Benedict Arnold'],['was the British king during the American Revolution','King George III'],['was a young French nobleman who became a general for the Americans','the Marquis de Lafayette'],['wrote to her husband urging Congress to "remember the ladies"','Abigail Adams'],['trained the Continental Army at Valley Forge','Baron von Steuben'],['was a spy who said, "I only regret that I have but one life to lose for my country"','Nathan Hale'],['commanded the British army that surrendered at Yorktown','Lord Cornwallis'],['signed the Declaration of Independence in famously large letters','John Hancock']], who, whatKnown),
    both([['the Proclamation of 1763','banned colonists from settling west of the Appalachian Mountains'],['the Sugar Act','taxed sugar and molasses brought into the colonies'],['the Stamp Act','taxed printed paper like newspapers, legal documents, and playing cards'],['the Townshend Acts','taxed imported glass, paint, paper, and tea'],['the Tea Act','gave one British company control of tea sales, sparking the Boston Tea Party'],['the Intolerable Acts','closed Boston Harbor to punish the colonists for the Boston Tea Party'],['the Quartering Act','forced colonists to house and supply British soldiers']],

      ([b, d]) => ({ q: `What happened at ${b}?`, explain: `${b}: ${d}.` }), ([d, b]) => ({ q: `Which Revolutionary War event was ${d}?`, explain: `${b}: ${d}.` })),
    () => { const [q, c, ...w] = pick([
        ['What was the first permanent English settlement in North America?','Jamestown, Virginia (1607)','Plymouth, Massachusetts (1620)','Roanoke (1587)','St. Augustine (1565)'],
