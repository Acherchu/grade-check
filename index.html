<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade Check</title>
<style>
  /* One dim, low-glare palette in every mode: muted slate, softened text, desaturated accents. */
  :root{
    color-scheme: dark;
    --bg:#191c22; --card:#20242c; --ink:#c9ced8; --muted:#848c9a; --line:#2f3540;
    --accent:#5c79c4; --accent-ink:#e6ebf5; --good:#6aa983; --good-bg:#1e2c24;
    --bad:#c97d72; --bad-bg:#2f2322; --gold:#c49a52; --board:#1b2b23; --chalk:#c8d0c3;
    --frame:#5a4130; --frame-shadow:#3b2a1f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  header.board{background:var(--board);color:var(--chalk);border-radius:14px;padding:22px 24px;margin-bottom:22px;
    border:6px solid var(--frame);box-shadow:0 4px 0 var(--frame-shadow)}
  header.board h1{margin:0;font-size:1.9rem;letter-spacing:.5px;font-family:"Segoe Print","Comic Sans MS",cursive}
  header.board p{margin:6px 0 0;opacity:.85}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
  .grades{display:grid;gap:12px}
  .grade{display:flex;align-items:center;gap:16px}
  .grade .num{flex:0 0 64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;font-weight:800;
    background:var(--bg);border:2px solid var(--line)}
  .grade.done .num{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .grade.ready .num{border-color:var(--accent);color:var(--accent)}
  .grade.locked{opacity:.55}
  .grade .info{flex:1;min-width:0}
  .grade h3{margin:0;font-size:1.15rem}
  .grade small{color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;
    transition:transform .07s ease, border-color .15s, background-color .15s}
  button:active:not(:disabled){transform:scale(.97)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .mute{position:fixed;bottom:14px;right:14px;z-index:10;width:42px;height:42px;padding:0;border-radius:50%;font-size:1.15rem;opacity:.8}
  .mute:hover{opacity:1}
  button:disabled{cursor:not-allowed;opacity:.6}
  button.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:4px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:.95rem}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .q{font-size:1.25rem;font-weight:600;margin:12px 0 18px;white-space:pre-line}
  .choices{display:grid;gap:10px}
  .choices button{text-align:left;padding:14px 16px;display:flex;gap:12px;align-items:center}
  .choices button:hover:not(:disabled){border-color:var(--accent)}
  .choices button.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
  .choices kbd{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font:700 .85rem system-ui}
  .result-head{text-align:center;padding:28px 20px}
  .result-head .big{font-size:3rem;line-height:1}
  .result-head h2{margin:10px 0 6px;font-size:1.6rem}
  .result-head.pass{border-color:var(--good);background:var(--good-bg)}
  .result-head.fail{border-color:var(--bad);background:var(--bad-bg)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .miss .q{font-size:1.05rem;margin:8px 0 12px}
  .ans{padding:8px 12px;border-radius:8px;margin:6px 0}
  .ans.yours{background:var(--bad-bg);color:var(--bad)}
  .ans.right{background:var(--good-bg);color:var(--good)}
  .fix{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);background:var(--bg);border-radius:6px;white-space:pre-line}
  .fix b{color:var(--gold)}
  h2.section{font-size:1.1rem;margin:26px 0 12px}
  .page-title{font-size:1.7rem;margin:4px 0 12px}
  .warn{color:var(--bad)}
  /* home: two big mode buttons */
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  button.mode{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;width:100%;text-align:left;padding:24px 22px;border-radius:14px}
  button.mode:hover{border-color:var(--accent)}
  .mode .icon{font-size:2.2rem;line-height:1}
  .mode h2{margin:12px 0 6px;font-size:1.35rem}
  .mode p{margin:0;color:var(--muted)}
  /* practice */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
  .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  button.topic{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
  button.topic:hover{border-color:var(--accent)}
  button.topic.weak{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
  .topic small{color:var(--muted);font-size:.82rem}
  .lesson h1{margin:10px 0 8px;font-size:1.6rem}
  .lesson h3{margin:20px 0 8px;font-size:1rem;color:var(--gold)}
  .lesson .intro{font-size:1.05rem;margin:0}
  .points{margin:0;padding-left:22px}
  .points li{margin:8px 0}
  .example{border-left:4px solid var(--accent);background:var(--bg);padding:12px 14px;border-radius:6px}
  .example .prob{font-weight:600;margin-bottom:6px}
  .choices button.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .choices button.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .choices button:disabled{opacity:1;cursor:default}
  #feedback .ans{margin-top:14px}
  .learn{margin-top:10px;text-align:left}
  .subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
  button.subject{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:12px}
  button.subject:hover, button.mix:hover{border-color:var(--accent)}
  .subject .icon{font-size:1.9rem;line-height:1}
  .subject .info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .subject .info b{font-size:1.1rem}
  .subject small{color:var(--muted);font-size:.85rem}
  .subject .chev{font-size:1.6rem;color:var(--muted)}
  .grade-note{font-size:.95rem;color:var(--muted);font-weight:400;margin-left:6px}
  button.mix{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 18px;border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,var(--card))}
  button.mix small{color:var(--muted)}
  .topic-list{display:grid;gap:10px}
  button.topic.wide{padding:14px 16px;gap:4px}
  .covers{color:var(--ink);opacity:.8;font-size:.92rem}
  .lesson .covers{margin:0 0 10px;color:var(--muted);opacity:1}
  .rules{color:var(--muted);font-size:.95rem;margin:0}
  @media (max-width:480px){ header.board h1{font-size:1.5rem} .grade .num{flex-basis:52px;height:52px;font-size:1.3rem} }
</style>
</head>

<script>
// ---------- helpers shared by the question banks ----------
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const nz = (a, b) => { let v; do v = R(a, b); while (v === 0); return v; };
const fmt = x => Number.isInteger(x) ? String(x) : String(+x.toFixed(2));
const sgn = x => x < 0 ? `(${x})` : String(x);           // wrap negatives in parens
// Build a multiple-choice question. Numeric answers get auto-filled distractors if needed.
function MQ(q, correct, wrongs, explain){
  const c = String(correct), seen = new Set([c]), w = [];
  for (const x of wrongs){ const s = String(x); if (!seen.has(s) && w.length < 3){ seen.add(s); w.push(s); } }
  // Not enough distinct wrong answers: nudge the first number in the correct answer ("$55" → "$61", "2/5" → "3/5").
  const m = c.match(/-?\d+(\.\d+)?/);
  if (m){
    const n = +m[0], plain = m[0] === c, step = plain ? 1 : Math.max(1, Math.round(Math.abs(n) * 0.1));
    for (let d = 1; w.length < 3 && d < 50; d++)
      for (const v of [n + d * step, n - d * step]){
        if (!plain && n >= 0 && v < 0) continue;
        const s = c.slice(0, m.index) + fmt(v) + c.slice(m.index + m[0].length);
        if (!seen.has(s) && w.length < 3){ seen.add(s); w.push(s); }
      }
  }
  return { q, answer: c, choices: shuffle([c, ...w]), explain };
}
// Fact-table generator: pick a random row [key, answer, note]; wrong choices come from other rows' answers.
// make(row) returns { q, explain }. Rows sharing the same answer are never used as distractors.
function fromTable(rows, make){
  const row = pick(rows);
  const wrongs = shuffle([...new Set(rows.map(r => r[1]).filter(a => a !== row[1]))]);
  const { q, explain } = make(row);
  return MQ(q, row[1], wrongs, explain);
}
// Classification generator: groups = { label: [items...] }. Asks which item belongs to a random label.
function fromGroups(groups, make){
  const labels = Object.keys(groups), label = pick(labels), item = pick(groups[label]);
  const others = shuffle(labels.filter(l => l !== label).flatMap(l => groups[l]));
  const { q, explain } = make(label, item);
  return MQ(q, item, others, explain);
}
// Reverse: show an item, ask which label it belongs to (for tables with 2-4 labels, fills wrongs from all labels).
function whichGroup(groups, make){
  const labels = Object.keys(groups), label = pick(labels), item = pick(groups[label]);
  const { q, explain } = make(label, item);
  return MQ(q, label, labels.filter(l => l !== label), explain);
}
const BANK = {};
</script>

<script>
// ================= 7th GRADE =================
BANK[7] = {
  Math: [
    () => { const a = nz(-12, 12), b = nz(-12, 12), s = a + b;
      return MQ(`What is ${a} + ${sgn(b)}?`, s, [a - b, -s, Math.abs(a) + Math.abs(b)],
        `Adding a negative is the same as subtracting. Same signs: add and keep the sign. Different signs: subtract the smaller absolute value from the larger and keep the sign of the larger. ${a} + ${sgn(b)} = ${s}.`); },
    () => { const a = nz(-9, 9), b = nz(-9, 9), p = a * b;
      return MQ(`What is ${a} × ${sgn(b)}?`, p, [-p, a + b, Math.abs(p) === p ? p + a : -p + b],
        `Multiply the numbers, then fix the sign: same signs → positive, different signs → negative. ${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(p)}, and the signs are ${(a < 0) === (b < 0) ? 'the same, so it is positive' : 'different, so it is negative'}: ${p}.`); },
    () => { const x = R(-8, 12), a = R(2, 9), b = nz(-15, 15), c = a * x + b;
      return MQ(`Solve for x:  ${a}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} = ${c}`, x, [(c + b) / a | 0, x + 2, -x, c - b],
        `Undo operations in reverse order. First ${b < 0 ? `add ${-b} to` : `subtract ${b} from`} both sides: ${a}x = ${c - b}. Then divide both sides by ${a}: x = ${x}. Check: ${a}(${x}) ${b < 0 ? '−' : '+'} ${Math.abs(b)} = ${c} ✓`); },
    () => { const pct = pick([10, 15, 20, 25, 30, 40, 50, 75]), base = R(2, 20) * 20, ans = base * pct / 100;
      return MQ(`What is ${pct}% of ${base}?`, fmt(ans), [fmt(base * pct / 10), fmt(base - ans), fmt(ans + pct)],
        `"Percent" means "out of 100", so ${pct}% = ${pct / 100}. "Of" means multiply: ${pct / 100} × ${base} = ${fmt(ans)}.`); },
    () => { const price = R(4, 30) * 5, off = pick([10, 20, 25, 30, 40, 50]), sale = price * (100 - off) / 100;
      return MQ(`A $${price} jacket is ${off}% off. What is the sale price?`, '$' + fmt(sale), ['$' + fmt(price * off / 100), '$' + fmt(price > off ? price - off : price + off), '$' + fmt(price + price * off / 100)],
        `Find the discount, then subtract it. ${off}% of $${price} = ${off / 100} × ${price} = $${fmt(price * off / 100)}. Sale price = $${price} − $${fmt(price * off / 100)} = $${fmt(sale)}. (Shortcut: pay ${100 - off}% → ${(100 - off) / 100} × ${price}.)`); },
    () => { const unit = pick([2, 3, 4, 5, 6, 8]), n = R(3, 9), cost = unit * n, m = R(10, 15);
      return MQ(`${n} notebooks cost $${cost}. At that rate, how much do ${m} notebooks cost?`, '$' + unit * m, ['$' + (cost + m - n), '$' + (cost + m), '$' + unit * (m - 1)],
        `Find the unit rate first: $${cost} ÷ ${n} = $${unit} per notebook. Then multiply by how many you want: $${unit} × ${m} = $${unit * m}.`); },
    () => { const r = R(2, 10), area = +(3.14 * r * r).toFixed(2);
      return MQ(`What is the area of a circle with radius ${r} cm? (Use π ≈ 3.14)`, fmt(area) + ' cm²', [fmt(+(2 * 3.14 * r).toFixed(2)) + ' cm²', fmt(+(3.14 * 2 * r * 2 * r).toFixed(2)) + ' cm²', fmt(+(3.14 * r).toFixed(2)) + ' cm²'],
        `Area of a circle is A = πr² — square the radius first, then multiply by π. ${r}² = ${r * r}, and 3.14 × ${r * r} = ${fmt(area)} cm². (2πr is the circumference, not the area.)`); },
    () => { const a = R(2, 9), b = R(2, 9), c = R(1, 9), d = R(1, 9);
      return MQ(`Simplify:  ${a}x + ${c} + ${b}x + ${d}`, `${a + b}x + ${c + d}`, [`${a + b + c + d}x`, `${a * b}x + ${c + d}`, `${a + b}x + ${c * d}`],
        `Combine like terms — x-terms with x-terms, plain numbers with plain numbers. ${a}x + ${b}x = ${a + b}x and ${c} + ${d} = ${c + d}, so the answer is ${a + b}x + ${c + d}. You can't add ${a + b}x and ${c + d} together because one has an x and one doesn't.`); },
    () => { const red = R(2, 8), blue = R(2, 8), green = R(1, 6), tot = red + blue + green;
      return MQ(`A bag has ${red} red, ${blue} blue, and ${green} green marbles. What is the probability of picking a blue marble?`, `${blue}/${tot}`, [`${blue}/${red + green}`, `1/3`, `${red}/${tot}`],
        `Probability = (favorable outcomes) ÷ (total outcomes). There are ${blue} blue marbles out of ${red} + ${blue} + ${green} = ${tot} total, so P(blue) = ${blue}/${tot}.`); },
    () => { const a = R(2, 6), b = R(3, 9), k = R(2, 5);
      return MQ(`Solve the proportion:  ${a}/${b} = x/${b * k}`, a * k, [a + b * k - b, b * k / a | 0, a * b],
        `Figure out what the bottom was multiplied by: ${b} × ${k} = ${b * k}. Do the same to the top: ${a} × ${k} = ${a * k}. (Or cross-multiply: ${b}x = ${a} × ${b * k}, so x = ${a * k}.)`); },
  ],
  English: [
    ['Which sentence uses "their" correctly?', 'The students forgot their homework.', ['Their going to the park later.', 'Put the box over their.', 'I think their right about that.'], '"Their" shows ownership (their homework). "There" is a place ("over there"), and "they\'re" means "they are". Test it: if you can swap in "they are", use they\'re.'],
    ['What is the theme of a story?', 'The central message or lesson about life', ['The order of events in the plot', 'The time and place of the story', 'The main character\'s name'], 'Theme is the big idea the author wants you to understand about life, like "honesty matters." Plot is what happens, setting is where/when. State a theme as a full sentence, not one word.'],
    ['Which word is an adverb in: "She quickly finished her test"?', 'quickly', ['finished', 'test', 'her'], 'Adverbs describe verbs, adjectives, or other adverbs — they tell how, when, where, or how much. "Quickly" tells HOW she finished. Many adverbs end in -ly.'],
    ['"The wind whispered through the trees." This is an example of:', 'Personification', ['Simile', 'Hyperbole', 'Alliteration'], 'Personification gives human actions to non-human things — wind can\'t really whisper. A simile compares using "like" or "as"; hyperbole is extreme exaggeration; alliteration repeats starting sounds.'],
    ['Which is a complete sentence (not a fragment)?', 'After school, we walked home.', ['After school walking home.', 'Because we walked home.', 'Walked home after school.'], 'A complete sentence needs a subject AND a verb AND a complete thought. "Because we walked home" has both but leaves you hanging — "because" makes it a dependent clause. "We walked home" is complete.'],
    ['What does the prefix "mis-" mean in "misunderstand"?', 'wrongly', ['again', 'before', 'not able'], '"Mis-" means wrongly or badly: misunderstand = understand wrongly, misspell = spell wrongly. "Re-" means again, "pre-" means before.'],
    ['Which sentence uses a comma correctly?', 'I wanted to go, but it was raining.', ['I wanted, to go but it was raining.', 'I wanted to go but, it was raining.', 'I, wanted to go but it was raining.'], 'When a conjunction (and, but, or, so) joins two complete sentences, put the comma BEFORE the conjunction: "I wanted to go, but it was raining."'],
    ['A story told using "I" and "me" by a character in the story is written in:', 'First-person point of view', ['Third-person limited', 'Third-person omniscient', 'Second-person point of view'], 'First person = the narrator is a character using I/me/we. Third person uses he/she/they and the narrator is outside the story. Second person uses "you."'],
    ['What is the main purpose of a persuasive essay?', 'To convince the reader to agree with an opinion', ['To entertain with a made-up story', 'To explain how to do something', 'To describe a person\'s life'], 'Persuasive (argumentative) writing takes a side and backs it with reasons and evidence. Look for opinion words like "should" and "must."'],
    ['Which word is a synonym for "enormous"?', 'huge', ['tiny', 'strange', 'loud'], 'Synonyms have the same or similar meaning. Enormous = huge. Antonyms are opposites (enormous vs. tiny).'],
    ['In "The dog chased the ball," what is the subject?', 'The dog', ['chased', 'the ball', 'chased the ball'], 'The subject is who or what does the action. Ask "Who chased?" → the dog. "Chased" is the verb and "the ball" is the object (what got chased).'],
    ['What is the climax of a story?', 'The turning point with the most tension', ['The introduction of the characters', 'The events after the problem is solved', 'The background information'], 'Plot order: exposition (intro) → rising action → CLIMAX (the peak moment, highest tension) → falling action → resolution. The climax is where the conflict comes to a head.'],
    ['Which sentence is written in the correct past tense?', 'Yesterday we swam in the lake.', ['Yesterday we swim in the lake.', 'Yesterday we swimmed in the lake.', 'Yesterday we have swam in the lake.'], '"Swim" is irregular: swim → swam → (have) swum. "Yesterday" signals simple past, so use "swam." Don\'t add -ed to irregular verbs.'],
    ['What is the best evidence to support a claim in an essay?', 'A fact or quote from a reliable source', ['Your personal feeling about the topic', 'A rumor you heard from a friend', 'A random statistic with no source'], 'Strong evidence is specific and trustworthy: facts, data, or direct quotes from credible sources. Then explain HOW it supports your claim.'],
  ],
  Science: [
    ['What is the basic unit of life?', 'The cell', ['The atom', 'The organ', 'The tissue'], 'All living things are made of cells — the smallest unit that can carry out life processes. Levels go: cell → tissue → organ → organ system → organism. Atoms are not alive.'],
    ['Which organelle is the "powerhouse" of the cell, releasing energy?', 'Mitochondria', ['Nucleus', 'Cell wall', 'Ribosome'], 'Mitochondria break down sugar (cellular respiration) to release energy. The nucleus holds DNA, ribosomes make proteins, the cell wall gives plants structure.'],
    ['What do plants make during photosynthesis?', 'Glucose (sugar) and oxygen', ['Carbon dioxide and water', 'Protein and nitrogen', 'Only oxygen'], 'Photosynthesis: carbon dioxide + water + sunlight → glucose + oxygen. Plants take IN CO₂ and water and give OFF oxygen. Remember it happens in chloroplasts.'],
    ['Which structure is found in plant cells but NOT in animal cells?', 'Cell wall', ['Cell membrane', 'Nucleus', 'Mitochondria'], 'Plant cells have a cell wall, chloroplasts, and a large central vacuole. Both plant and animal cells have a membrane, nucleus, and mitochondria.'],
    ['In a food chain, what is an organism that makes its own food called?', 'Producer', ['Consumer', 'Decomposer', 'Predator'], 'Producers (plants, algae) make food from sunlight. Consumers eat other organisms. Decomposers (fungi, bacteria) break down dead things. Food chains always start with a producer.'],
    ['What is the difference between a physical and a chemical change?', 'A chemical change makes a new substance', ['A physical change makes a new substance', 'Chemical changes only happen with heat', 'There is no difference'], 'Physical change = same substance, new form (melting ice, tearing paper). Chemical change = a new substance forms (burning, rusting, baking). Signs: gas bubbles, color change, light/heat, new smell.'],
    ['A dominant allele is written as "B" and recessive as "b". Which genotype shows the recessive trait?', 'bb', ['BB', 'Bb', 'bB'], 'The recessive trait only shows when there is no dominant allele to hide it — you need two recessive copies (bb). Bb looks dominant because one B is enough.'],
    ['What is the smallest particle of an element that keeps its properties?', 'Atom', ['Molecule', 'Cell', 'Compound'], 'An atom is the smallest piece of an element (like one gold atom). A molecule is two or more atoms bonded together. A compound is atoms of DIFFERENT elements bonded.'],
    ['What layer of Earth do we live on?', 'Crust', ['Mantle', 'Outer core', 'Inner core'], 'Earth\'s layers from outside in: crust (thin rocky surface) → mantle (hot, slowly flowing rock) → outer core (liquid metal) → inner core (solid metal).'],
    ['In the scientific method, what is a hypothesis?', 'A testable prediction about what will happen', ['A proven law of nature', 'The final conclusion', 'A list of materials'], 'A hypothesis is an educated, testable guess, often written "If ___, then ___." You test it with an experiment, then write a conclusion about whether the data supported it.'],
    ['In an experiment, the variable the scientist changes on purpose is the:', 'Independent variable', ['Dependent variable', 'Control variable', 'Constant'], 'Independent = what YOU change. Dependent = what you measure (it depends on the change). Controls/constants stay the same so the test is fair.'],

    ([w, s]) => ({ q: `Which word is a synonym for "${w}" (means about the same)?`, explain: `"${w}" means "${s}". Synonyms are words with the same or similar meaning. Tip: put the choice into a sentence in place of "${w}" and see if the meaning stays the same.` })),
  // Antonyms
  () => fromTable([['expand','shrink'],['ancient','modern'],['generous','selfish'],['victory','defeat'],['rigid','flexible'],['temporary','permanent'],['scarce','plentiful'],['arrive','depart'],['maximum','minimum'],['include','exclude'],['accept','reject'],['brave','cowardly'],['polite','rude'],['ascend','descend'],['transparent','opaque'],['private','public'],['frequent','rare'],['shallow','deep'],['cautious','reckless'],['borrow','lend'],['simple','complex'],['praise','criticize'],['increase','decrease'],['guilty','innocent']],
    ([w, a]) => ({ q: `Which word is an antonym of "${w}" (means the opposite)?`, explain: `The opposite of "${w}" is "${a}". Antonyms are words with opposite meanings (hot/cold). Don't mix them up with synonyms, which mean the same thing.` })),
  // Prefixes
  () => fromTable([['un','not','unhappy'],['re','again','rewrite'],['pre','before','preview'],['mis','wrongly','misspell'],['sub','under','submarine'],['inter','between','international'],['trans','across','transport'],['anti','against','antibiotic'],['ex','out of','exit'],['semi','half','semicircle'],['tri','three','triangle'],['multi','many','multicolored'],['post','after','postgame'],['co','together','coworker'],['auto','self','autograph'],['micro','small','microscope'],['over','too much','overcook']],
    ([p, m, ex]) => ({ q: `What does the prefix "${p}-" mean, as in "${ex}"?`, explain: `"${p}-" means "${m}", so "${ex}" is built from "${m}" + the rest of the word. Learning prefixes lets you figure out words you've never seen.` })),
  // Suffixes
  () => fromTable([['less','without','careless'],['ful','full of','hopeful'],['er','one who','teacher'],['able','able to be','readable'],['ology','the study of','biology'],['ness','the state of being','kindness'],['ly','in a certain way','quickly'],['ist','a person who practices','artist'],['phobia','fear of','arachnophobia']],
    ([s, m, ex]) => ({ q: `What does the suffix "-${s}" mean, as in "${ex}"?`, explain: `"-${s}" means "${m}". A suffix goes at the END of a word and often changes its meaning or part of speech.` })),
  // Figurative language
  () => whichGroup({
      simile: ['Her smile was as bright as the sun.', 'He ran like a cheetah.', 'The baby slept like a rock.', 'The lake was as smooth as glass.', 'My brother eats like a vacuum cleaner.'],
      metaphor: ['The classroom was a zoo.', 'Time is a thief.', 'Her voice was music to his ears.', 'The snow was a white blanket on the town.', 'Life is a roller coaster.'],
      personification: ['The alarm clock screamed at me.', 'The flowers danced in the breeze.', 'The old car groaned up the hill.', 'The moon smiled down on us.', 'Opportunity knocked on her door.'],
      hyperbole: ["I'm so hungry I could eat a horse.", 'This backpack weighs a ton.', "I've told you a million times.", 'The line was a mile long.', 'He is older than dirt.'],
      onomatopoeia: ['The angry wasps buzzed around the hive.', 'The bacon sizzled in the pan.', 'Boom! The fireworks lit up the sky.', 'The door creaked open.', 'The cow mooed at the farmer.'],
      alliteration: ['Sally sells seashells by the seashore.', 'Big bears bounce on blue balloons.', 'Peter picked a peck of peppers.', 'Tiny Tim took ten turtles to town.', 'Five funny frogs fished for flies.'],
    }, (label, s) => ({ q: `What kind of figurative language is this?\n"${s}"`, explain: `This is ${label}. ` + {
      simile: 'A simile compares two things using "like" or "as".', metaphor: 'A metaphor says one thing IS another — no "like" or "as".',
      personification: 'Personification gives human actions or feelings to something that isn\'t human.', hyperbole: 'Hyperbole is an exaggeration so big it can\'t be literally true.',
      onomatopoeia: 'Onomatopoeia is a word that imitates a sound (buzz, sizzle, boom).', alliteration: 'Alliteration repeats the same beginning sound in words close together.' }[label] })),
  // Irregular past tense
  () => { const [p, past] = pick([['go','went'],['bring','brought'],['catch','caught'],['teach','taught'],['think','thought'],['swim','swam'],['write','wrote'],['ride','rode'],['freeze','froze'],['choose','chose'],['speak','spoke'],['fly','flew'],['draw','drew'],['throw','threw'],['begin','began'],['sing','sang'],['drink','drank'],['buy','bought'],['fight','fought'],['sleep','slept'],['take','took'],['shake','shook'],['steal','stole'],['break','broke']]);
    return MQ(`What is the correct past tense of "${p}"?`, past, [p.replace(/e$/, '') + 'ed', p, past === 'bought' ? 'brought' : past === 'brought' ? 'bought' : past.replace(/e$/, '') + 'ed'],
      `"${p}" is an irregular verb, so you don't add -ed. Today I ${p}; yesterday I ${past}. Irregular verbs have to be memorized — say "Yesterday I ___" out loud to check.`); },
  // Sentence types
  () => whichGroup({

<script>

BANK[7].Science.push(
  () => fromTable([['controls the cell and holds its DNA','nucleus'],['releases energy from food (cellular respiration)','mitochondria'],['makes food from sunlight in plant cells','chloroplast'],['controls what enters and leaves the cell','cell membrane'],['gives plant cells a stiff shape and support','cell wall'],['builds proteins','ribosome'],['stores water in plant cells','vacuole'],['is the jelly-like fluid that fills the cell','cytoplasm']],
    ([f, o]) => ({ q: `Which part of the cell ${f}?`, explain: `The ${o} ${f}. Quick map: nucleus = control center, mitochondria = energy, chloroplast = photosynthesis, membrane = gatekeeper, cell wall = support, ribosome = proteins.` })),
  () => fromGroups({
      biotic: ['an oak tree','a mushroom','bacteria in soil','a hawk','moss on a rock','an earthworm','algae in a pond','a honeybee'],
      abiotic: ['sunlight','rainwater','air temperature','a rock','sand','oxygen gas','wind','minerals in soil'] },
    (label, item) => ({ q: `Which of these is ${label === 'biotic' ? 'BIOTIC (living or once living)' : 'ABIOTIC (non-living)'}?`,
      explain: `${item[0].toUpperCase() + item.slice(1)} is ${label}. Biotic factors are living things (plants, animals, fungi, bacteria). Abiotic factors are non-living parts of an ecosystem: sunlight, water, air, rocks, temperature.` })),
  () => fromGroups({
      chemical: ['wood burning','iron rusting','baking a cake','milk going sour','a firework exploding','digesting food','a sliced apple turning brown','vinegar fizzing with baking soda'],
      physical: ['ice melting','cutting paper','dissolving sugar in water','boiling water','crushing a can','breaking glass','water freezing','mixing sand and salt'] },
    (label, item) => ({ q: `Which of these is a ${label.toUpperCase()} change?`,
      explain: `${item[0].toUpperCase() + item.slice(1)} is a ${label} change. Chemical change = a NEW substance forms (signs: gas, color change, heat/light, new smell, can't easily undo). Physical change = same substance, just a new shape, size, or state.` })),
  () => whichGroup({
      producer: ['grass','an oak tree','algae','a sunflower','seaweed'], herbivore: ['a rabbit','a deer','a grasshopper','a cow','a caterpillar'],
      carnivore: ['a wolf','a shark','a hawk','a lion','a snake'], decomposer: ['a mushroom','bacteria','mold','fungi on a log'] },
    (label, item) => ({ q: `In a food web, what role does ${item} play?`, explain: `${item[0].toUpperCase() + item.slice(1)} is a ${label}. ` +
      { producer: 'Producers make their own food using sunlight (photosynthesis).', herbivore: 'Herbivores are consumers that eat only plants.',
        carnivore: 'Carnivores are consumers that eat other animals.', decomposer: 'Decomposers break down dead organisms and return nutrients to the soil.' }[label] })),
  // Punnett squares
  () => {
    const [L, dom, rec] = pick([['B','brown fur','white fur'],['T','tall stems','short stems'],['P','purple flowers','white flowers'],['R','round seeds','wrinkled seeds']]);
    const l = L.toLowerCase(), g = () => pick([L + L, L + l, l + l]);
    const p1 = g(), p2 = g(), kids = [];
    for (const a of p1) for (const b of p2) kids.push(a === L || b !== L ? a + b : b + a);
    const nRec = kids.filter(k => k === l + l).length, askRec = Math.random() < .5;
    const pct = (askRec ? nRec : 4 - nRec) * 25 + '%';
    return MQ(`${L} (${dom}) is dominant over ${l} (${rec}). A ${p1} parent is crossed with a ${p2} parent.\nWhat percent of offspring are expected to have ${askRec ? rec : dom}?`,
      pct, shuffle(['0%','25%','50%','75%','100%']),
      `Make a Punnett square: put ${p1[0]} and ${p1[1]} across the top, ${p2[0]} and ${p2[1]} down the side, and combine. The 4 boxes are ${kids.join(', ')}. Only ${l}${l} shows ${rec}; anything with a capital ${L} shows ${dom}. That's ${askRec ? nRec : 4 - nRec} of 4 boxes = ${pct}.`);
  },
  () => fromTable([['breaks down food into nutrients','digestive system'],['brings in oxygen and removes carbon dioxide','respiratory system'],['pumps blood through the body','circulatory system'],['sends signals using the brain and nerves','nervous system'],['supports the body and protects organs with bones','skeletal system'],['moves the body using muscles','muscular system'],['fights germs and disease','immune system'],['filters waste out of the blood with the kidneys','excretory system'],['makes hormones that control growth','endocrine system']],
    ([f, s]) => ({ q: `Which body system ${f}?`, explain: `The ${s} ${f}. Body systems work together — for example, the respiratory system gets oxygen and the circulatory system delivers it.` })),
  () => whichGroup({
      igneous: ['forms when magma or lava cools and hardens','granite','obsidian (volcanic glass)','basalt','pumice'],
      sedimentary: ['forms from layers of sand, mud, and shells pressed together','sandstone','limestone','a rock that often contains fossils','shale'],
      metamorphic: ['forms when heat and pressure change an existing rock','marble (made from limestone)','slate (made from shale)','gneiss'] },
    (label, item) => ({ q: `Which type of rock is this: ${item}?`, explain: `That's ${label} rock. Igneous = cooled magma/lava ("ignis" means fire). Sedimentary = layers of sediment pressed and cemented together (where fossils are found). Metamorphic = rock changed by heat and pressure ("meta" means change).` })),
  () => fromTable([['a solid to a liquid','melting'],['a liquid to a solid','freezing'],['a liquid to a gas','evaporation'],['a gas to a liquid','condensation'],['a solid straight to a gas','sublimation'],['a gas straight to a solid','deposition']],
    ([d, t]) => ({ q: `What is the change from ${d} called?`, explain: `Going from ${d} is ${t}. Adding heat moves matter toward gas (melting, evaporation, sublimation); removing heat moves it toward solid (condensation, freezing, deposition). Example: dew on grass is condensation; dry ice "smoking" is sublimation.` })),
  // Experiment variables
  () => {
    const [setup, ind, dep, ctrl] = pick([
      ['A student tests how the amount of sunlight affects how tall bean plants grow.', 'the amount of sunlight', 'the height of the plants', 'the type of bean plant'],
      ['Maya tests whether water temperature changes how fast sugar dissolves.', 'the water temperature', 'the time it takes sugar to dissolve', 'the amount of sugar used'],
      ['A class tests how the height of a ramp affects how far a toy car rolls.', 'the height of the ramp', 'the distance the car rolls', 'using the same toy car'],
      ['Leo tests if the type of fertilizer affects how many tomatoes a plant grows.', 'the type of fertilizer', 'the number of tomatoes', 'the amount of water given'],
      ['A scientist tests how minutes of exercise affect a person\'s heart rate.', 'the minutes of exercise', 'the heart rate', 'the type of exercise'],
      ['Ana tests how the number of paper clips on a paper airplane affects how far it flies.', 'the number of paper clips', 'the distance the plane flies', 'the paper airplane design']]);
    const askInd = Math.random() < .5;
    return MQ(`${setup}\nWhat is the ${askInd ? 'independent' : 'dependent'} variable?`, askInd ? ind : dep, [askInd ? dep : ind, ctrl, 'the date of the experiment'],
      `Independent variable = what the scientist CHANGES on purpose (${ind}). Dependent variable = what gets MEASURED as a result (${dep}). Things kept the same, like ${ctrl}, are controlled variables.`);
  },
  () => { const rows = [['hydrogen','H'],['helium','He'],['carbon','C'],['nitrogen','N'],['oxygen','O'],['sodium','Na'],['magnesium','Mg'],['aluminum','Al'],['silicon','Si'],['chlorine','Cl'],['potassium','K'],['calcium','Ca'],['iron','Fe'],['copper','Cu'],['silver','Ag'],['gold','Au'],['lead','Pb'],['neon','Ne'],['sulfur','S'],['zinc','Zn']];
    const note = (e, s) => `The symbol for ${e} is ${s}. Symbols start with a capital letter, and a second letter is lowercase. Some come from Latin names: Na (natrium) = sodium, K (kalium) = potassium, Fe (ferrum) = iron, Cu (cuprum) = copper, Ag (argentum) = silver, Au (aurum) = gold, Pb (plumbum) = lead.`;
    return Math.random() < .5
      ? fromTable(rows, ([e, s]) => ({ q: `What is the chemical symbol for ${e}?`, explain: note(e, s) }))
      : fromTable(rows.map(([e, s]) => [s, e]), ([s, e]) => ({ q: `Which element has the chemical symbol "${s}"?`, explain: note(e, s) })); },
  () => { const right = ['cell','tissue','organ','organ system','organism'], seen = new Set([right.join(' → ')]), wrongs = [];
    while (wrongs.length < 3){ const s = shuffle(right).join(' → '); if (!seen.has(s)){ seen.add(s); wrongs.push(s); } }
    return MQ('Which list puts the levels of organization in order from SMALLEST to LARGEST?', right.join(' → '), wrongs,
      'Cells group into tissues (like muscle tissue), tissues form organs (the heart), organs work together in organ systems (circulatory system), and systems make up a whole organism (you).'); },
);
</script>

    ([a, civ]) => ({ q: `Which civilization ${a}?`, explain: `${civ} ${a}. Link each civilization to its location and one big achievement: Egypt–Nile–pyramids, Mesopotamia–rivers–writing & laws, China–Great Wall & paper, Greece–democracy, Rome–republic & engineering, Maya/Aztec/Inca–the Americas.` })),
  () => whichGroup({

      'Executive branch': ['carries out and enforces the laws','is led by the President','can veto a bill','commands the military','negotiates treaties with other countries'],
      'Judicial branch': ['decides whether laws follow the Constitution','is headed by the Supreme Court','interprets what laws mean','hears federal court cases'] },
    (label, item) => ({ q: `Which branch of the U.S. government ${item}?`, explain: `The ${label} ${item}. Remember: Legislative (Congress) = MAKES laws, Executive (President) = ENFORCES laws, Judicial (courts) = INTERPRETS laws.` })),
  () => fromTable([['land surrounded by water on three sides','peninsula'],['land surrounded by water on all sides','island'],['a chain or group of islands','archipelago'],['a narrow strip of land connecting two larger landmasses','isthmus'],['a narrow waterway connecting two larger bodies of water','strait'],['a large, flat area of land raised above the land around it','plateau'],['land built up where a river empties into a larger body of water','delta'],['a stream or river that flows into a larger river','tributary'],['part of an ocean or lake partly surrounded by land','bay'],['a low area of land between hills or mountains','valley']],
    ([d, t]) => ({ q: `What geographic feature is ${d}?`, explain: `That's a ${t}. Examples help it stick: Florida is a peninsula, Panama is an isthmus, Hawaii is an archipelago, the Nile has a delta, and the Missouri is a tributary of the Mississippi.` })),
  () => fromTable([['what you give up when you make a choice','opportunity cost'],['having limited resources but unlimited wants','scarcity'],['how much of a product people want and can afford to buy','demand'],['how much of a product is available to sell','supply'],['trading goods directly without using money','barter'],['a plan for how to spend and save money','budget'],['money paid to the government to fund public services','tax'],['extra money a bank pays you for keeping savings there','interest'],['goods bought from another country','import'],['goods sold to another country','export'],['money a business has left after paying its costs','profit']],
    ([d, t]) => ({ q: `Which economics term means ${d}?`, explain: `That's ${t}. Try using it in a sentence: if you spend Saturday at a game instead of working, the pay you missed is your opportunity cost.` })),
  () => fromTable([['was founded by Siddhartha Gautama, the Buddha','Buddhism'],['follows the teachings of Jesus','Christianity'],['follows the prophet Muhammad and the Quran','Islam'],['began with the ancient Hebrews and is based on the Torah','Judaism'],['began in ancient India with beliefs in karma, dharma, and many gods','Hinduism'],['was founded by Guru Nanak in the Punjab region','Sikhism'],['is based on Confucius\'s teachings about respect, family, and good government','Confucianism']],
    ([d, r]) => ({ q: `Which belief system ${d}?`, explain: `${r} ${d}. Judaism, Christianity, and Islam are monotheistic (one God) and began in the Middle East; Hinduism and Buddhism began in India; Confucianism began in China.` })),
  // Timeline: which came first / last

  },

    const H = { N: 'Northern', S: 'Southern', E: 'Eastern', W: 'Western' }, combo = (a, b) => `${H[a]} and ${H[b]}`;
    return MQ(`A place is located at ${lat}°${ns}, ${lon}°${ew}. Which hemispheres is it in?`, combo(ns, ew), [combo(ns === 'N' ? 'S' : 'N', ew), combo(ns, ew === 'E' ? 'W' : 'E'), combo(ns === 'N' ? 'S' : 'N', ew === 'E' ? 'W' : 'E')],
      `Latitude (the first number) is measured north or south of the Equator, so ${ns} = ${H[ns]} Hemisphere. Longitude (the second number) is measured east or west of the Prime Meridian, so ${ew} = ${H[ew]} Hemisphere.`); },
);
</script>

<script>
// ================= 7th GRADE — extra Math generators =================
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const frac = (n, d) => { const g = gcd(n, d); return d / g === 1 ? String(n / g) : `${n / g}/${d / g}`; };
BANK[7].Math.push(
  () => { const a = R(2, 20), b = R(2, 9), c = R(2, 9), d = R(1, 15), v = a + b * c - d;
    return MQ(`What is ${a} + ${b} × ${c} − ${d}?`, v, [(a + b) * c - d, a + b * (c - d), (a + b) * (c - d)],
      `Order of operations (PEMDAS): multiply before adding or subtracting. ${b} × ${c} = ${b * c}. Then go left to right: ${a} + ${b * c} = ${a + b * c}, and ${a + b * c} − ${d} = ${v}.`); },
  () => { const a = R(2, 15), b = R(-5, 25), sym = pick(['>', '<', '≥', '≤']);
    return MQ(`Solve the inequality:  x + ${a} ${sym} ${b}`, `x ${sym} ${b - a}`, [`x ${sym} ${b + a}`, `x ${{ '>': '<', '<': '>', '≥': '≤', '≤': '≥' }[sym]} ${b - a}`, `x ${sym} ${a - b}`],
      `Solve it like an equation: subtract ${a} from both sides to get x ${sym} ${b} − ${a}, so x ${sym} ${b - a}. The sign only flips when you multiply or divide by a NEGATIVE number — subtracting doesn't flip it.`); },
  () => { const d = R(2, 20), c = +(3.14 * d).toFixed(2);
    return MQ(`What is the circumference of a circle with diameter ${d} in? (π ≈ 3.14)`, fmt(c) + ' in', [fmt(+(3.14 * d * 2).toFixed(2)) + ' in', fmt(+(3.14 * (d / 2) ** 2).toFixed(2)) + ' in', fmt(+(3.14 * d / 2).toFixed(2)) + ' in'],
      `Circumference = π × diameter (or 2πr). 3.14 × ${d} = ${fmt(c)} in. Be careful: if you're given the diameter, don't double it again.`); },
  () => { const n = R(4, 6), mean = R(6, 20); let vals;
    do { vals = Array.from({ length: n - 1 }, () => mean + R(-5, 5)); vals.push(mean * n - vals.reduce((s, v) => s + v, 0)); } while (vals[n - 1] < 1);
    const sorted = [...vals].sort((a, b) => a - b), sum = mean * n;
    return MQ(`What is the mean (average) of: ${vals.join(', ')}?`, mean, [sorted[Math.floor(n / 2)], sorted[n - 1] - sorted[0], fmt(sum / (n - 1))],
      `Mean = add all the values, then divide by how many there are. ${vals.join(' + ')} = ${sum}. There are ${n} numbers, so ${sum} ÷ ${n} = ${mean}. (Middle value = median; biggest − smallest = range.)`); },
  () => { const P = R(2, 20) * 100, r = pick([2, 3, 4, 5, 6]), t = R(2, 6), I = P * r * t / 100;
    return MQ(`You put $${P} in a savings account earning ${r}% simple interest per year. How much interest do you earn in ${t} years?`, '$' + fmt(I), ['$' + fmt(P * r / 100), '$' + fmt(P + I), '$' + fmt(P * r * t)],
      `Simple interest I = P × r × t. Change the rate to a decimal: ${r}% = ${r / 100}. I = ${P} × ${r / 100} × ${t} = $${fmt(I)}. (Your total balance would be $${fmt(P + I)}, but the question asks for just the interest.)`); },
  () => { const oldP = R(2, 10) * 10, pct = pick([10, 20, 25, 30, 50]), newP = oldP * (100 + pct) / 100, up = Math.random() < .5;

    return MQ(`A price changes from $${fmt(a)} to $${fmt(b)}. What is the percent ${up ? 'increase' : 'decrease'}?`, p, [fmt(change / b * 100) + '%', fmt(change) + '%', fmt(b / a * 100) + '%'],
      `Percent change = (amount of change ÷ ORIGINAL amount) × 100. The change is $${fmt(change)}, and the original is $${fmt(a)}. ${fmt(change)} ÷ ${fmt(a)} = ${fmt(change / a)} → ${p}. Always divide by the starting value, not the new one.`); },
  () => { const l = R(2, 12), w = R(2, 10), h = R(2, 9), v = l * w * h;
    return MQ(`What is the volume of a box that is ${l} cm long, ${w} cm wide, and ${h} cm tall?`, v + ' cm³', [(l + w + h) + ' cm³', 2 * (l * w + l * h + w * h) + ' cm³', l * w + ' cm³'],
      `Volume of a rectangular prism = length × width × height. ${l} × ${w} × ${h} = ${v} cm³. Volume uses cubic units because you multiplied three lengths. (2lw + 2lh + 2wh would be surface area.)`); },

<script>

  () => fromTable([['chron','time','chronological'],['bio','life','biography'],['geo','earth','geology'],['graph','write','autograph'],['tele','far','telescope'],['photo','light','photosynthesis'],['phon','sound','symphony'],['port','carry','portable'],['dict','say','contradict'],['spect','look','spectator'],['rupt','break','erupt'],['aqua','water','aquarium'],['therm','heat','thermostat'],['struct','build','construction'],['ject','throw','projectile'],['mal','bad','malfunction'],['bene','good','benefit'],['cred','believe','credible'],['manu','hand','manuscript'],['astro','star','astronomy'],['ped','foot','pedestrian']],

  () => { const rows = [['Swimming is my favorite sport.','Swimming','gerund'],['She enjoys reading mystery novels.','reading','gerund'],['Cheating is against the rules.','Cheating','gerund'],['His hobby is collecting coins.','collecting','gerund'],
      ['The barking dog woke the neighbors.','barking','participle'],['We sat by the crackling fire.','crackling','participle'],['The broken vase lay on the floor.','broken','participle'],['Exhausted, the runners crossed the finish line.','Exhausted','participle'],
      ['I want to learn Spanish.','to learn','infinitive'],['Her goal is to become a doctor.','to become','infinitive'],['They decided to leave early.','to leave','infinitive'],['To win, we must practice every day.','To win','infinitive']];
    const [s, w, t] = pick(rows);

  () => { const agents = ['the coach','the chef','my sister','the mayor','a famous artist','the students'], acts = [['wrote','written','the letter'],['broke','broken','the window'],['painted','painted','the fence'],['cooked','cooked','dinner'],['won','won','the trophy'],['planted','planted','the garden'],['fixed','fixed','the bike']];
    const cap = s => s[0].toUpperCase() + s.slice(1);

    const combos = shuffle(agents).slice(0, 4).map((a, i) => [a, shuffle(acts)[i]]), wantPassive = Math.random() < .5;
    const [ra, rv] = combos[0], right = wantPassive ? pas(ra, rv) : act(ra, rv);

      `"${right}" is ${wantPassive ? 'passive' : 'active'}. Active voice: the subject DOES the action ("${act(ra, rv)}"). Passive voice: the subject RECEIVES the action, usually with "was ___ by" ("${pas(ra, rv)}").`); },
  () => { const [c, ...w] = pick([['separate','seperate','separete','seprate'],['definitely','definately','definitly','defenitely'],['receive','recieve','receeve','receve'],['occurrence','occurence','occurrance','ocurrence'],['embarrass','embarass','embarras','embaress'],['calendar','calender','calandar','calander'],['beginning','begining','beggining','beginnig'],['believe','beleive','belive','beleve'],['government','goverment','govermant','governmint'],['environment','enviroment','envirnment','environmint'],['tomorrow','tommorow','tomorow','tommorrow'],['rhythm','rythm','rhythem','rythem'],['weird','wierd','weerd','wierde'],['accommodate','accomodate','acommodate','acomodate'],['argument','arguement','argumant','arguemint']]);
    const tips = { separate: 'there is "a rat" in sep-A-R-A-te', definitely: 'it contains the word "finite"', receive: '"i before e, except after c"', embarrass: 'you turn Really Red and feel Silly Silly', beginning: 'begin + n + ing (double the n)', believe: "don't beLIEve a LIE", government: 'it comes from "govern" + "ment"', environment: 'it contains "iron": envIRONment', weird: "it's a weird word — it breaks the i-before-e rule", accommodate: 'it is big enough for two c\'s and two m\'s', argument: 'you drop the e from "argue"', calendar: 'it ends in -ar like "January"' };
    return MQ('Which word is spelled correctly?', c, w, `The correct spelling is "${c}".${tips[c] ? ` Memory trick: ${tips[c]}.` : ' Break it into syllables and picture each one.'}`); },
  () => { const subjects = [['Each of the players', 1], ['Neither of the answers', 1], ['The box of crayons', 1], ['Everyone in the class', 1], ['One of my friends', 1], ['The teacher, along with her students,', 1],
      ['Both of the dogs', 0], ['The players on the team', 0], ['My brother and sister', 0], ['Several of the books', 0], ['The students in the band', 0]];
    const [v1, v0, tail] = pick([['is', 'are', 'ready'], ['has', 'have', 'a question'], ['was', 'were', 'late'], ['wants', 'want', 'pizza'], ['plays', 'play', 'outside']]);

  () => fromTable([['a hint about what will happen later in the story','foreshadowing'],['a scene that jumps back to show earlier events','flashback'],['when the audience knows something a character does not','dramatic irony'],['when the opposite of what you expect happens','situational irony'],['the struggle between opposing forces in a story','conflict'],['the main character of a story','protagonist'],['the character or force working against the main character','antagonist'],['a reference to a well-known person, place, event, or work','allusion'],['the feeling a reader gets from a text','mood'],['the author\'s attitude toward the subject','tone'],['an object that stands for a bigger idea','symbol'],['a character who changes in an important way during the story','dynamic character'],['the lesson or message about life the story shows','theme']],
    ([d, t]) => ({ q: `Which literary term means ${d}?`, explain: `That's ${t}. Make a flash card for each literary term with a short example from a book or movie you know — examples stick better than definitions.` })),
  () => { const [pos, neu, neg] = pick([['confident','sure of oneself','arrogant'],['curious','interested','nosy'],['slender','thin','skinny'],['determined','persistent','stubborn'],['thrifty','careful with money','cheap'],['youthful','young','childish'],['aroma','smell','stench'],['relaxed','calm','lazy'],['talkative','chatty','loud-mouthed'],['unique','different','weird']]);
    const wantNeg = Math.random() < .5, ans = wantNeg ? neg : pos;
    return MQ(`These words have similar meanings. Which has the most ${wantNeg ? 'NEGATIVE' : 'POSITIVE'} connotation?`, ans, [neu, wantNeg ? pos : neg],
      `Denotation is the dictionary meaning; connotation is the feeling a word carries. "${pos}" sounds positive, "${neu}" is fairly neutral, and "${neg}" sounds negative. Writers pick words by connotation to shape how you feel.`); },
  () => { const [s, right, wrong] = pick([['Mom took my brother and ___ to the movies.','me','I'],['My friend and ___ went to the mall.','I','me'],['This is a secret between you and ___.','me','I'],['The coach gave the award to Jordan and ___.','me','I'],['Who gave the tickets to Maria and ___?','her','she'],['Sam and ___ went to soccer practice.','she','her'],['The teacher asked Leo and ___ to stay after class.','him','he'],['Dad and ___ built a birdhouse.','he','him']]);

<script>

      `Rearrange F = ma to m = F ÷ a. m = ${F} N ÷ ${a} m/s² = ${m} kg. Cover the letter you want in the F-m-a triangle: F on top, m and a on the bottom.`);
    return MQ(`A ${F} N force pushes a ${m} kg cart. What is its acceleration? (F = ma)`, a + ' m/s²', [F * m + ' m/s²', F - m + ' m/s²', fmt(m / F) + ' m/s²'],

<script>

BANK[8].Math.push(
  () => { const b = R(2, 9), m = R(2, 5), n = R(2, 4);
    return MQ(`Simplify:  (${b}^${m})^${n}`, `${b}^${m * n}`, [`${b}^${m + n}`, `${b * n}^${m}`, `${b}^${m ** n}`],
      `A power raised to a power: keep the base and MULTIPLY the exponents. (${b}^${m})^${n} = ${b}^(${m}×${n}) = ${b}^${m * n}. You add exponents only when multiplying two powers with the same base.`); },
  () => { const b = pick([2, 3, 4, 5, 10]), n = R(1, 3), zero = Math.random() < .25;
    if (zero) return MQ(`What is ${b}^0?`, 1, [0, b, `1/${b}`], `Any nonzero number to the 0 power equals 1. Pattern: ${b}³ = ${b ** 3}, ${b}² = ${b ** 2}, ${b}¹ = ${b}, ${b}⁰ = 1 — each step divides by ${b}.`);
    return MQ(`What is ${b}^(−${n})?`, `1/${b ** n}`, [`−${b ** n}`, `−${b * n}`, `1/${b * n}`],
      `A negative exponent means "flip it" (take the reciprocal), not "make it negative". ${b}^(−${n}) = 1/${b}^${n} = 1/${b ** n}.`); },
  () => { const a = R(1, 4), b = R(2, 3), m = R(2, 6), n = R(2, 6), p = a * b;
    return MQ(`Multiply:  (${a} × 10^${m}) × (${b} × 10^${n})`, `${p} × 10^${m + n}`, [`${p} × 10^${m * n}`, `${a + b} × 10^${m + n}`, `${p} × 10^${Math.abs(m - n)}`],
      `Multiply the front numbers: ${a} × ${b} = ${p}. Multiply the powers of ten by ADDING exponents: 10^${m} × 10^${n} = 10^${m + n}. Answer: ${p} × 10^${m + n}.`); },
  () => { const m = nz(-4, 5), b = R(-6, 8), rows = [0, 1, 2, 3].map(x => `x = ${x} → y = ${m * x + b}`);
    return MQ(`What is the rate of change (slope) in this table?\n${rows.join('\n')}`, m, [b, -m, m * 2],
      `Rate of change = change in y ÷ change in x. Each time x goes up by 1, y changes by ${m * 1 + b} − ${sgn(b)} = ${m}. So the slope is ${m}. (${b} is the y-value when x = 0 — that's the y-intercept.)`); },
  () => { const a = R(2, 7), bb = nz(-6, 6), x = R(-5, 8), c = a * (x + bb);
    return MQ(`Solve for x:  ${a}(x ${bb < 0 ? '−' : '+'} ${Math.abs(bb)}) = ${c}`, x, [c / a + bb, x + bb, (c - bb) / a | 0],
      `Distribute or divide first. Dividing both sides by ${a}: x ${bb < 0 ? '−' : '+'} ${Math.abs(bb)} = ${c / a}. Then ${bb < 0 ? 'add' : 'subtract'} ${Math.abs(bb)}: x = ${x}.`); },
  () => { const r = R(1, 6) * 3, h = R(1, 5) * 3, v = +(3.14 * r * r * h / 3).toFixed(2);
    return MQ(`Find the volume of a cone with radius ${r} cm and height ${h} cm. (π ≈ 3.14)`, fmt(v) + ' cm³', [fmt(+(3.14 * r * r * h).toFixed(2)) + ' cm³', fmt(+(3.14 * r * h / 3).toFixed(2)) + ' cm³', fmt(+(3.14 * r * r * h / 2).toFixed(2)) + ' cm³'],
      `Volume of a cone = (1/3)πr²h — exactly one-third of a cylinder with the same base and height. (1/3) × 3.14 × ${r}² × ${h} = (1/3) × 3.14 × ${r * r} × ${h} = ${fmt(v)} cm³.`); },
  () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15], [7, 24, 25], [12, 16, 20]]);
    return MQ(`A right triangle has a hypotenuse of ${c} and one leg of ${a}. How long is the other leg?`, b, [c - a, c + a, c * c - a * a],
      `Use a² + b² = c² and solve for the missing leg: b² = c² − a² = ${c * c} − ${a * a} = ${b * b}. Then b = √${b * b} = ${b}. Subtract the squares — not the side lengths.`); },
  () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 6, 10]]), x1 = R(-5, 3), y1 = R(-5, 3), sx = pick([1, -1]), sy = pick([1, -1]), x2 = x1 + sx * a, y2 = y1 + sy * b;
    return MQ(`What is the distance between (${x1}, ${y1}) and (${x2}, ${y2})?`, c, [a + b, a * a + b * b, Math.abs(x2 + y2 - x1 - y1)],
      `Draw a right triangle between the points. Horizontal leg = |${x2} − ${sgn(x1)}| = ${a}, vertical leg = |${y2} − ${sgn(y1)}| = ${b}. Then use the Pythagorean theorem: √(${a}² + ${b}²) = √${a * a + b * b} = ${c}.`); },
  () => fromGroups({ rational: ['√49', '0.75', '−3/8', '5.121212… (repeating)', '√0.25', '−12'], irrational: ['√2', 'π', '√15', '0.1010010001… (never repeats)', '√50'] },
    (label, item) => ({ q: `Which of these numbers is ${label.toUpperCase()}?`, explain: `${item} is ${label}. Rational numbers can be written as a fraction of integers — that includes whole numbers, terminating decimals, repeating decimals, and square roots of perfect squares (√49 = 7). Irrational numbers never end or repeat, like π and √ of non-perfect squares.` })),
  () => { const lo = R(2, 11), n = R(lo * lo + 1, (lo + 1) ** 2 - 1);
    return MQ(`Between which two whole numbers is √${n}?`, `${lo} and ${lo + 1}`, [`${lo - 1} and ${lo}`, `${lo + 1} and ${lo + 2}`, `${Math.floor(n / 2)} and ${Math.floor(n / 2) + 1}`],
      `Find the perfect squares around ${n}: ${lo}² = ${lo * lo} and ${lo + 1}² = ${(lo + 1) ** 2}. Since ${lo * lo} < ${n} < ${(lo + 1) ** 2}, √${n} is between ${lo} and ${lo + 1}.`); },
  () => { const x = R(-6, 6), y = R(-6, 6), kind = pick(['translate', 'x-axis', 'y-axis']), a = nz(-5, 5), b = nz(-5, 5);
    if (kind === 'translate') return MQ(`Point (${x}, ${y}) is translated ${Math.abs(a)} units ${a > 0 ? 'right' : 'left'} and ${Math.abs(b)} units ${b > 0 ? 'up' : 'down'}. Where does it land?`, `(${x + a}, ${y + b})`, [`(${x + b}, ${y + a})`, `(${x - a}, ${y - b})`, `(${x + a}, ${y - b})`],
      `Left/right changes x; up/down changes y. x: ${x} ${a > 0 ? '+' : '−'} ${Math.abs(a)} = ${x + a}. y: ${y} ${b > 0 ? '+' : '−'} ${Math.abs(b)} = ${y + b}. New point: (${x + a}, ${y + b}).`);
    const ans = kind === 'x-axis' ? `(${x}, ${-y})` : `(${-x}, ${y})`;
    return MQ(`Point (${x}, ${y}) is reflected over the ${kind}. What are the new coordinates?`, ans, [kind === 'x-axis' ? `(${-x}, ${y})` : `(${x}, ${-y})`, `(${-x}, ${-y})`, `(${y}, ${x})`],
      `Reflecting over the ${kind} flips the ${kind === 'x-axis' ? 'y' : 'x'}-coordinate's sign and keeps the other the same: ${ans}. Picture folding the graph along the ${kind}.`); },
  () => { const a = R(25, 100), b = R(20, 150 - a), c = 180 - a - b;
    return MQ(`Two angles of a triangle measure ${a}° and ${b}°. What is the third angle?`, `${c}°`, [`${360 - a - b}°`, `${Math.abs(a - b)}°`, `${c + 10}°`],
      `The angles in any triangle add up to 180°. 180° − ${a}° − ${b}° = ${c}°.`); },
  () => { const x = R(-5, 6), m = nz(-4, 4), b = R(-8, 8), y = m * x + b;
    return MQ(`Solve the system:\ny = ${m}x ${b < 0 ? '−' : '+'} ${Math.abs(b)}\ny = ${y}\nWhat is x?`, x, [y, -x, fmt((y + b) / m)],
      `Substitute y = ${y} into the first equation: ${y} = ${m}x ${b < 0 ? '−' : '+'} ${Math.abs(b)}. ${b < 0 ? 'Add' : 'Subtract'} ${Math.abs(b)}: ${y - b} = ${m}x. Divide by ${m}: x = ${x}. The solution is the point (${x}, ${y}).`); },
);

<script>

    ex: ['Solve 4x − 7 = 21', 'Add 7 to both sides: 4x = 28. Divide both sides by 4: x = 7. Check: 4(7) − 7 = 28 − 7 = 21 ✓'] },
  { id: 'ratios', name: 'Ratios, rates & proportions', items: [5, 9, 19],
    intro: 'Ratios compare two amounts. Rates compare amounts with different units, like dollars per item or miles per hour.',
    points: ['A ratio can be written 3 to 4, 3:4, or 3/4.', 'A unit rate is the amount for ONE: $12 for 4 → $3 each.', 'A proportion says two ratios are equal. Solve by scaling up/down or by cross-multiplying.', 'Map scales are proportions: multiply the map distance by the scale.'],
    ex: ['6 apples cost $4.50. How much do 10 apples cost?', 'Unit rate: $4.50 ÷ 6 = $0.75 per apple. Then 10 × $0.75 = $7.50.'] },

    ex: ['A $40 game is 15% off. What is the sale price?', '15% of $40 = 0.15 × 40 = $6. Sale price = $40 − $6 = $34. (Shortcut: 0.85 × 40 = $34.)'] },
  { id: 'geometry', name: 'Circles, angles & volume', items: [6, 12, 16, 18],

    ex: ['A circle has radius 4. Find its area and circumference. (π ≈ 3.14)', 'Area = 3.14 × 4² = 3.14 × 16 = 50.24 square units. Circumference = 2 × 3.14 × 4 = 25.12 units.'] },

    ex: ['Data: 4, 8, 6, 10, 7. Find the mean, median, and range.', 'Mean: (4 + 8 + 6 + 10 + 7) ÷ 5 = 35 ÷ 5 = 7. In order: 4, 6, 7, 8, 10 → median = 7. Range: 10 − 4 = 6.'] },

LESSONS[7].English = [
  { id: 'grammar', name: 'Parts of speech', items: [2, 10, 14],
    intro: 'Every word in a sentence has a job. Knowing the jobs helps you write clearly and fix mistakes.',

    return MQ(q, c, w, `"${c}" is correct. Singular owner: add 's (the dog's). Plural owner ending in s: add just ' (the dogs'). Plural owner NOT ending in s: add 's (children's, mice's). Don't use apostrophes to make plurals (two cats), and its (ownership) has no apostrophe.`); },
  () => { const [b, comp, sup] = pick([['tall','taller','tallest'],['happy','happier','happiest'],['good','better','best'],['bad','worse','worst'],['big','bigger','biggest'],['funny','funnier','funniest'],['careful','more careful','most careful'],['beautiful','more beautiful','most beautiful'],['far','farther','farthest'],['hot','hotter','hottest'],['simple','simpler','simplest'],['busy','busier','busiest'],['important','more important','most important'],['many','more','most']]);
    const askSup = Math.random() < .5, ans = askSup ? sup : comp, long = comp.includes(' ');
    return MQ(`What is the ${askSup ? 'superlative (comparing 3 or more)' : 'comparative (comparing 2)'} form of "${b}"?`, ans,
      [askSup ? comp : sup, long ? b + (askSup ? 'est' : 'er') : askSup ? `most ${sup}` : `more ${comp}`, long ? (askSup ? `mostest ${b}` : `more ${b}er`) : b + (askSup ? 'est' : 'er')],
      `${b} → ${comp} → ${sup}. Short words add -er/-est (double the last consonant after a short vowel: bigger; y → i: happier). Longer words use more/most. Never use both (not "more taller"). Some are irregular: good/better/best, bad/worse/worst.`); },
);
</script>

<script>
// ================= MORE QUESTIONS — 7th English: vocabulary & figurative language =================
{
  const SYN = [['accurate','correct'],['adore','love'],['anxious','worried'],['brief','short'],['cease','stop'],['clumsy','awkward'],['conceal','hide'],['construct','build'],['declare','announce'],['demolish','destroy'],['depart','leave'],['diminish','shrink'],['exhausted','tired'],['famished','hungry'],['feeble','weak'],['gigantic','enormous'],['grateful','thankful'],['hilarious','funny'],['inquire','ask'],['jubilant','joyful'],['lethal','deadly'],['mimic','copy'],['modify','change'],['novice','beginner'],['obstacle','barrier'],['observe','watch'],['persuade','convince'],['prohibit','forbid'],['swift','quick'],['reside','live'],['scarce','rare'],['sturdy','strong'],['tranquil','peaceful'],['vivid','bright'],['wicked','evil'],['yearn','long for'],['baffled','confused'],['candid','honest'],['foe','enemy']];
  const ANT = [['absent','present'],['ancestor','descendant'],['artificial','natural'],['bold','timid'],['capture','release'],['cheap','expensive'],['compliment','insult'],['conceal','reveal'],['courage','fear'],['defend','attack'],['dull','sharp'],['entrance','exit'],['forget','remember'],['friend','enemy'],['giant','dwarf'],['hero','villain'],['horizontal','vertical'],['humble','proud'],['import','export'],['lenient','strict'],['major','minor'],['noisy','silent'],['optimist','pessimist'],['float','sink'],['raise','lower'],['retreat','advance'],['rough','smooth'],['shrink','grow'],['success','failure'],['united','divided'],['vanish','appear'],['wide','narrow'],['wild','tame'],['wise','foolish'],['strong','weak'],['awake','asleep'],['arrival','departure'],['mandatory','optional']];
  const flip = rows => rows.map(([a, b]) => [b, a]);
  addTo(7, 'English', 'vocab',
    () => fromTable(Math.random() < .5 ? SYN : flip(SYN), ([w, s]) => ({ q: `Which word means about the SAME as "${w}"?`, explain: `"${w}" and "${s}" are synonyms — they mean about the same thing. Test it by swapping one for the other in a sentence.` })),
    () => fromTable(Math.random() < .5 ? ANT : flip(ANT), ([w, a]) => ({ q: `Which word means the OPPOSITE of "${w}"?`, explain: `"${w}" and "${a}" are antonyms — opposites. If you picked a word with a similar meaning, that's a synonym instead.` })),
    () => { const [s, w, m, ...wr] = pick([
        ['The hikers were so FATIGUED after the long climb that they fell asleep right away.','fatigued','very tired','very excited','lost','hungry'],
        ['Maria is so METICULOUS that she checks every answer three times.','meticulous','very careful about details','lazy','forgetful','fast'],
        ['The old bridge was PRECARIOUS, swaying with every step we took.','precarious','unsafe and unsteady','brand new','beautiful','long'],
        ['After the storm, the streets were INUNDATED with water up to our knees.','inundated','flooded','cleaned','dried out','blocked by trees'],
        ['He was so AFFABLE that everyone at the party wanted to talk to him.','affable','friendly and easy to talk to','rude','shy','famous'],
        ['This medicine will ALLEVIATE your headache so you feel better.','alleviate','make less painful','cause','ignore','make worse'],
        ['The desert was ARID; it had not rained there in two years.','arid','very dry','very cold','crowded','green'],
        ['She was RELUCTANT to jump into the cold pool and stood at the edge for ten minutes.','reluctant','unwilling or hesitant','excited','unable to swim','in a hurry'],
        ['The puppy was so DOCILE that even the toddler could pet it safely.','docile','gentle and calm','wild','tiny','sick'],
        ['The teacher asked us to CONDENSE our five-page report into one paragraph.','condense','shorten','expand','rewrite neatly','read aloud'],
        ['His directions were so AMBIGUOUS that nobody knew which way to go.','ambiguous','unclear','funny','short','correct'],
        ['We need to CONSERVE water during the drought, so take short showers.','conserve','save or use carefully','waste','heat up','clean'],
        ['The lion moved STEALTHILY through the grass, so quietly the zebra never heard it.','stealthily','secretly and quietly','loudly','quickly','clumsily'],
        ['Grandpa is FRUGAL; he reuses bags and never buys things he doesn\'t need.','frugal','careful with money','wealthy','wasteful','forgetful'],
        ['My little brother was so VEXED by the broken toy that he stomped away.','vexed','annoyed','delighted','confused','sleepy'],
        ['The cafeteria was BUSTLING, with students rushing in every direction.','bustling','busy and full of activity','empty','dirty','silent'],
        ['The scientist\'s claim was DUBIOUS because she had no evidence at all.','dubious','doubtful','proven','exciting','famous'],
        ['The kitten was so TIMID that it hid under the bed whenever guests came.','timid','shy and easily scared','playful','hungry','angry'],
        ['The chef added a MINUSCULE pinch of salt — you could barely see it.','minuscule','extremely small','huge','spicy','expensive'],
        ['After three days of rain, the sunshine was a WELCOME change; everyone ran outside happily.','welcome','gladly received','unwanted','strange','short']]);
      return MQ(`${s}\nUse context clues: what does "${w}" mean?`, m, wr, `"${w}" means "${m}." Reread the sentence and look for words around it that explain or describe it — then swap your answer into the sentence to see if it still makes sense.`); },
    () => { const [s, w, m, ...wr] = pick([

        ['A BAT flew out of the cave at night.','bat','a flying mammal','a wooden club for hitting a ball','to hit a ball','a type of bird'],
        ['The river BANK was muddy after the rain.','bank','the land along the side of a river','a place to keep money','to rely on something','a pile of snow'],
        ['I put my allowance in the BANK.','bank','a business that keeps money','the land beside a river','the tilt of an airplane','a row of seats'],
        ['We will PITCH the tent near the lake.','pitch','set up','throw','a musical note','a sales speech'],
        ['The singer hit a very high PITCH.','pitch','how high or low a sound is','a throw in baseball','sticky black tar','to set up a tent'],
        ["Please WATCH your little brother while I cook.",'watch','keep an eye on','a clock worn on the wrist','a guard on duty','to wait in line'],
        ['My grandpa gave me a gold WATCH.','watch','a clock worn on the wrist','to look at closely','a guard on duty','a necklace'],
        ['The FAIR had rides and cotton candy.','fair','an event with rides and games','treating everyone equally','light in color','not too bad'],
        ['The referee made a FAIR call.','fair','equal and just','an event with rides','light in color','very beautiful'],
        ['I will PRESENT my project to the class.','present','show or give a talk about','a gift','happening now','in attendance'],
        ['Everyone in class was PRESENT today.','present','here, in attendance','a gift','to show to a group','the current time'],
        ['Hand me that SPRING so I can fix the toy.','spring','a coiled piece of metal','the season after winter','a source of water in the ground','to jump suddenly'],
        ['Flowers bloom in the SPRING.','spring','the season after winter','a coiled wire','to jump up quickly','a small stream'],
        ['The cat will SPRING onto the counter.','spring','jump suddenly','the season after winter','a metal coil','to leak water'],
        ['The ship dropped its ANCHOR in the bay.','anchor','a heavy object that holds a boat in place','a news reporter','to hold something steady','the last runner in a relay'],
        ['She is the ANCHOR on the evening news.','anchor','the main host of a news show','a heavy weight for a boat','the last runner on a relay team','a metal hook'],
        ['Turn LEFT at the next light.','left','the direction opposite of right','went away','remaining','forgot']]);
      return MQ(`"${s}"\nIn this sentence, what does "${w}" mean?`, m, wr, `Here "${w}" means "${m}." "${w}" is a multiple-meaning word, so the other sentences around it decide which meaning fits. Ask yourself: which meaning makes sense in THIS sentence?`); },
    () => { const [w, m, ...wr] = pick([['preheat','heat before','heat again','not heat','heat too much'],['rewrite','write again','write before','write badly','not write'],['unkind','not kind','very kind','kind again','kind before'],['misread','read wrongly','read again','read before','not read'],['careless','without care','full of care','one who cares','care again'],['hopeful','full of hope','without hope','hope again','not hopeful'],['submerge','put under water','lift above water','fill with water','move across water'],['bicycle','a cycle with two wheels','a cycle with one wheel','a cycle with three wheels','a cycle with no wheels'],['nonstop','without stopping','stopping often','stopping again','before stopping'],['disagree','not agree','agree again','agree strongly','agree before'],['teacher','one who teaches','the act of teaching','able to be taught','teaching again'],['readable','able to be read','one who reads','read again','without reading'],['overcook','cook too much','cook before','not cook','cook again'],['transatlantic','across the Atlantic','under the Atlantic','before the Atlantic','without the Atlantic'],['postwar','after a war','before a war','against war','during a war'],['antiwar','against war','after a war','before a war','during a war'],['semicircle','half a circle','a whole circle','many circles','three circles'],['kindness','the state of being kind','without kindness','one who is kind','not kind'],['fearless','without fear','full of fear','afraid again','one who fears'],['imperfect','not perfect','very perfect','perfect again','perfect before']]);
      return MQ(`Use the prefix or suffix: what does "${w}" mean?`, m, wr, `"${w}" means "${m}." Break it into parts — find the base word, then add the meaning of the prefix (front) or suffix (end). Common ones: re- again, pre- before, un-/non-/dis-/im- not, mis- wrongly, over- too much, -less without, -ful full of, -er one who, -able able to be, -ness state of being.`); },
  );

  const FIG = {
    simile: ['The kitten was as light as a feather.','His hands were cold like ice.','She swims like a fish.','The stars sparkled like diamonds.','My room is as neat as a pin.','The runner shot off like a rocket.','He was as busy as a bee.','Her hair was soft like silk.'],
    metaphor: ['My brother is a couch potato.','The world is a stage.','Her eyes were oceans of blue.','That test was a monster.','The playground was a battlefield at recess.','Books are windows to the world.','The city is a jungle.','My bedroom is a disaster zone.'],
    personification: ['The sun smiled on our picnic.','My computer hates me today.','The leaves whispered in the wind.','The stairs groaned under our weight.','Thunder grumbled in the distance.','The camera loves her.','The waves slapped angrily at the rocks.','The old car coughed and refused to start.'],
    hyperbole: ["I've been waiting forever.",'My backpack weighs a million pounds.','I could sleep for a year.','This is the worst day in the history of the world.','She has a ton of homework.','I nearly died laughing.','My feet are killing me.','He is taller than a skyscraper.'],
    onomatopoeia: ['The balloon went pop!','The clock ticked all night.','Splash! He jumped into the pool.','The dog growled at the stranger.','The snake hissed.','Crunch went the leaves under my boots.','The phone buzzed on the table.','Bang! The door slammed shut.'],
    alliteration: ['Silly Sam sang silly songs.','Busy bears bake bread by the barn.','Great green goblins gobbled grapes.','Lazy lions lounge in the light.','Mike made marvelous muffins.','Daring dogs dig deep ditches.','Carla carefully cut colorful cards.','Wendy wished for warm weather.'],
  };
  const FIG_WHY = { simile: 'A simile compares two things using "like" or "as."', metaphor: 'A metaphor says one thing IS another, with no "like" or "as."', personification: 'Personification gives human actions or feelings to something that isn\'t human.', hyperbole: 'Hyperbole is an exaggeration too extreme to be literally true.', onomatopoeia: 'Onomatopoeia is a word that imitates a sound.', alliteration: 'Alliteration repeats the same beginning sound in nearby words.' };
  const IDIOMS = [["It's raining cats and dogs.",'It is raining very hard.'],['Break a leg!','Good luck!'],['That quiz was a piece of cake.','It was very easy.'],['Hold your horses.','Wait and be patient.'],['He spilled the beans.','He told a secret.'],["I'm feeling under the weather.",'I feel sick.'],["Don't cry over spilled milk.","Don't get upset about something that can't be changed."],['She hit the books.','She studied hard.'],['It cost an arm and a leg.','It was very expensive.'],["Let's call it a day.","Let's stop working for now."],['You hit the nail on the head.','You said exactly the right thing.'],["We're in the same boat.",'We are in the same situation.'],['Just bite the bullet.',"Do the hard thing you've been avoiding."],['That happens once in a blue moon.','It happens very rarely.'],['He got cold feet.','He got nervous and wanted to back out.'],["She's on cloud nine.",'She is extremely happy.'],['Cut to the chase.','Get to the point.'],['The ball is in your court.',"It's your turn to decide."],["He's pulling your leg.","He's joking with you."],["Stop beating around the bush.",'Stop avoiding saying something directly.'],['Actions speak louder than words.','What you do matters more than what you say.'],["You're barking up the wrong tree.","You're looking in the wrong place or blaming the wrong person."],['Losing that game was a blessing in disguise.','Something that seemed bad turned out to be good.'],['The party got out of hand.','The party got out of control.'],["My parents don't see eye to eye on this.",'My parents disagree about this.']];
  addTo(7, 'English', 'figurative',
    () => whichGroup(FIG, (label, s) => ({ q: `What kind of figurative language is used here?\n"${s}"`, explain: `This is ${label}. ${FIG_WHY[label]}` })),
    () => fromGroups(FIG, (label, s) => ({ q: `Which sentence uses ${label.toUpperCase()}?`, explain: `"${s}" uses ${label}. ${FIG_WHY[label]}` })),
    () => fromTable(IDIOMS, ([i, m]) => ({ q: `What does this idiom mean?\n"${i}"`, explain: `"${i}" means: ${m} An idiom is a saying whose meaning is different from its literal words — you have to learn what the whole phrase means.` })),
    () => fromTable(flip(IDIOMS), ([m, i]) => ({ q: `Which idiom means: "${m}"`, explain: `"${i}" is the idiom that means ${m.charAt(0).toLowerCase() + m.slice(1)} Idioms don't mean what their words literally say.` })),
    () => { const [line, c, ...w] = pick([
        ['"The classroom was a zoo."','The classroom was loud and out of control.','Animals were in the classroom.','The class took a field trip.','The classroom was very quiet.'],
        ['"Her words were daggers."','Her words were hurtful.','She was holding knives.','She spoke very quietly.','Her words were kind.'],
        ['"He has a heart of gold."','He is very kind and generous.','He is very rich.','He has heart problems.','He loves jewelry.'],
        ['"Time is money."','Wasting time is like wasting something valuable.','You get paid for every minute.','Clocks are expensive.','Money makes time go faster.'],
        ['"The news hit me like a ton of bricks."','The news was shocking and upsetting.','Bricks fell on me.','The news was boring.','The news was about construction.'],
        ['"My little sister is a walking dictionary."','She knows a lot of words.','She carries books everywhere.','She walks a lot.','She is always reading.'],
        ['"The lake was a mirror."','The lake was very still and reflective.','Someone put a mirror in the lake.','The lake was frozen and broken.','The lake was very dirty.'],
        ['"The wind howled all night."','The wind was loud and strong.','A wolf was outside.','The wind was calm.','Someone was crying.'],
        ['"I have a mountain of laundry."','I have a very large amount of laundry.','My laundry is on a mountain.','My laundry is very heavy rock.','I finished my laundry.'],
        ['"She\'s as sharp as a tack."','She is very smart.','She is pointy.','She is mean.','She is very thin.']]);
      return MQ(`What does this figurative line most likely mean?\n${line}`, c, w, `It means: ${c} Figurative language isn't literal. Picture what the comparison suggests — what quality do the two things share?`); },
  );
}
