<script>
// ---------- sound: synthesized with Web Audio, so there are no files to load ----------
const Sound = (() => {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem('gradecheck.muted') === '1'; } catch {}
  const ac = () => {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  // A pitched blip with a fast attack and exponential decay; `slide` bends the pitch for a "pop".
  function tone(freq, { at = 0, dur = 0.08, type = 'sine', vol = 0.15, slide = 1 } = {}){
    const c = ac(), t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  // A tiny burst of filtered noise — the crisp transient that makes a click feel physical.
  function snap(vol = 0.08, cutoff = 2500){
    const c = ac(), len = Math.floor(c.sampleRate * 0.018), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 4;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination);
    s.start();
  }
  const play = fn => { if (!muted) try { fn(); } catch {} };
  return {
    get muted(){ return muted; },
    setMuted(m){ muted = m; try { localStorage.setItem('gradecheck.muted', m ? '1' : '0'); } catch {} },
    button:    () => play(() => { snap(0.05, 3000); tone(480, { dur: 0.05, vol: 0.08, slide: 0.75 }); }),
    answer:    () => play(() => { snap(0.09); tone(660, { dur: 0.1, vol: 0.14, slide: 0.5 }); tone(1320, { dur: 0.04, vol: 0.03, slide: 0.6 }); }),
    right:     () => play(() => { snap(0.06); tone(784, { dur: 0.12, vol: 0.09, type: 'triangle' }); tone(1175, { at: 0.07, dur: 0.24, vol: 0.08, type: 'triangle' }); }),
    wrong:     () => play(() => { snap(0.07, 1200); tone(233, { dur: 0.22, vol: 0.11, type: 'triangle', slide: 0.8 }); }),
    milestone: () => play(() => { tone(880, { dur: 0.18, vol: 0.07, type: 'triangle' }); tone(1175, { at: 0.08, dur: 0.3, vol: 0.06, type: 'triangle' }); }),
    pass:      () => play(() => { [523, 659, 784, 1047].forEach((f, i) => tone(f, { at: i * 0.1, dur: 0.32, vol: 0.11, type: 'triangle' })); tone(1568, { at: 0.42, dur: 0.7, vol: 0.05 }); }),
    fail:      () => play(() => { tone(392, { dur: 0.22, vol: 0.1, type: 'triangle' }); tone(330, { at: 0.18, dur: 0.45, vol: 0.1, type: 'triangle', slide: 0.94 }); }),
  };
})();

const muteBtn = document.getElementById('mute');
const drawMute = () => { muteBtn.textContent = Sound.muted ? '🔇' : '🔊'; };
muteBtn.onclick = () => { Sound.setMuted(!Sound.muted); drawMute(); Sound.button(); };
drawMute();
// Every ordinary button clicks on press (answers and the mute toggle have their own sounds).
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (b && !b.disabled && !b.dataset.k && b !== muteBtn) Sound.button();
});

// ---------- engine ----------
const SUBJECTS = ['Math', 'English', 'Science', 'Social Studies'];
const PER_SUBJECT = 25, TEST_LEN = PER_SUBJECT * SUBJECTS.length, PASS = 80, MAX_MISSES = TEST_LEN - PASS;
const MAX_FIXED = 8;   // at most this many hand-written questions per subject; the rest are generated fresh
const GRADES = Object.keys(BANK).map(Number).sort((a, b) => a - b);
const ord = g => g + (g === 1 ? 'st' : g === 2 ? 'nd' : g === 3 ? 'rd' : 'th');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const app = document.getElementById('app');

const KEY = 'gradecheck.v1';
// topics: "grade|subject|topicId" → { miss: test misses, right / tries: practice results }
const fresh = () => ({ certified: [], best: {}, seen: [], current: null, topics: {} });
function load(){ try { return { ...fresh(), ...JSON.parse(localStorage.getItem(KEY)) }; } catch { return fresh(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {} }
let progress = load();
const unlocked = g => g === GRADES[0] || progress.certified.includes(GRADES[GRADES.indexOf(g) - 1]);

// Every question you've been asked (oldest first), so new tests avoid repeats.
// A question is identified by its wording + answer, since one template can ask about many different answers.
const RECENT = 3 * TEST_LEN;
function markSeen(qs){
  const keys = qs.map(q => q.key);
  progress.seen = [...progress.seen.filter(k => !keys.includes(k)), ...keys].slice(-4000);
}

function buildTest(grade){
  const ever = new Set(progress.seen), recent = new Set(progress.seen.slice(-RECENT)), used = new Set(), qs = [];
  // freshness: 0 = never seen, 1 = seen but not in the last few tests, 2 = seen recently
  const age = k => !ever.has(k) ? 0 : !recent.has(k) ? 1 : 2;
  const add = (subject, q) => { used.add(q.key); qs.push({ subject, ...q }); };
  for (const subj of SUBJECTS){
    const items = BANK[grade][subj];
    const gens = shuffle(items.filter(x => typeof x === 'function'));
    const fixed = shuffle(items.filter(x => typeof x !== 'function')).map(f => ({ f, key: f[0] + '|' + f[1] }))
      .sort((a, b) => age(a.key) - age(b.key));
    const fixedQ = ({ f, key }) => ({ ...MQ(f[0], f[1], shuffle(f[2]), f[3]), key, topic: f.topic });
    let n = 0;
    // A few hand-written questions (freshest first)...
    for (const f of fixed.slice(0, gens.length ? MAX_FIXED : PER_SUBJECT)) if (age(f.key) === 0 || !gens.length){ add(subj, fixedQ(f)); n++; }
    // ...then generated questions, round-robin across generators. Accept never-seen first, then not-recent, then anything new to this test.
    for (let g = 0, tries = 0; n < PER_SUBJECT && gens.length && tries < 900; g++, tries++){
      const gen = gens[g % gens.length], q = gen();
      q.key = q.q + '|' + q.answer; q.topic = gen.topic;
      if (used.has(q.key) || age(q.key) > (tries < 300 ? 0 : tries < 600 ? 1 : 2)) continue;
      add(subj, q); n++;
    }
    for (const f of fixed){ if (n >= PER_SUBJECT) break; if (!used.has(f.key)){ add(subj, fixedQ(f)); n++; } }
  }
  return shuffle(qs);
}

let test = null, prac = null, practiceGrade = GRADES[0];

const findTopic = (g, s, id) => LESSONS[g][s].find(t => t.id === id);
const topicKey = (g, s, id) => `${g}|${s}|${id}`;
const tstat = k => progress.topics[k] || (progress.topics[k] = { miss: 0, right: 0, tries: 0 });
// A topic is a weak spot while its test misses outweigh practice (every 2 correct practice answers cancel 1 miss).
function weakSpots(){
  return Object.entries(progress.topics)
    .map(([k, st]) => { const [g, s, id] = k.split('|'); return { g: +g, s, id, st, score: st.miss - st.right / 2 }; })
    .filter(w => w.score > 0 && LESSONS[w.g]?.[w.s] && findTopic(w.g, w.s, w.id))
    .sort((a, b) => b.score - a.score);
}
const resumeCard = () => progress.current ? `<div class="card grade ready"><div class="num">▶</div>
    <div class="info"><h3>Test in progress</h3><small>${ord(progress.current.grade)} grade · question ${progress.current.i + 1} of ${TEST_LEN} · ${progress.current.misses.length} missed</small></div>
    <button class="primary" id="resume">Resume</button></div>` : '';
function bindCommon(back){
  const r = document.getElementById('resume');
  if (r) r.onclick = () => { test = progress.current; showQuestion(); };
  const b = document.getElementById('back');
  if (b) b.onclick = back;
  window.scrollTo(0, 0);
}

function home(){
  test = null; prac = null;
  const top = GRADES.filter(g => progress.certified.includes(g)).pop(), weak = weakSpots().length;
  app.innerHTML = `
    <header class="board">
      <h1>Grade Check</h1>
      <p>${top ? `You're certified through <b>${ord(top)} grade</b>.` : `Prove what you know, one grade at a time.`}</p>
    </header>
    ${resumeCard()}
    <div class="modes">
      <button class="mode" id="go-test"><div class="icon">📝</div><h2>Take a Test</h2>
        <p>${TEST_LEN} random questions across ${SUBJECTS.length} subjects. Score ${PASS} to certify a grade and unlock the next one.</p></button>
      <button class="mode" id="go-practice"><div class="icon">📚</div><h2>Practice &amp; Learn</h2>
        <p>${weak ? `<b class="warn">${weak} weak spot${weak > 1 ? 's' : ''} to review.</b> ` : ''}Pick any topic, read a quick lesson, and practice with instant feedback.</p></button>
    </div>`;
  document.getElementById('go-test').onclick = testHome;
  document.getElementById('go-practice').onclick = () => practiceHome();
  bindCommon();
}

function testHome(){
  test = null; prac = null;
  app.innerHTML = `
    <div class="topbar"><button class="link" id="back">← Home</button></div>
    <h1 class="page-title">📝 Tests</h1>
    <div class="card"><p class="rules">Each test has ${TEST_LEN} random questions — ${PER_SUBJECT} each of ${SUBJECTS.join(', ')}.
      Get <b>${PASS} right</b> to be certified and unlock the next grade. Miss ${MAX_MISSES + 1} and the test ends —
      you'll see every mistake with how to fix it, then try a brand-new test.</p></div>
    ${resumeCard()}
    <div class="grades">${GRADES.map(g => {
      const done = progress.certified.includes(g), open = unlocked(g);
      const cls = done ? 'done' : open ? 'ready' : 'locked';
      const status = done ? `Certified ✓ · best ${progress.best[g]}/${TEST_LEN}` : open ? 'Ready to test' : `🔒 Pass ${ord(g - 1)} grade to unlock`;
      return `<div class="card grade ${cls}">
        <div class="num">${g}</div>
        <div class="info"><h3>${ord(g)} Grade</h3><small>${status}</small></div>
        <button class="${open && !done ? 'primary' : ''}" data-start="${g}" ${open ? '' : 'disabled'}>${done ? 'Retake' : 'Start'}</button>
      </div>`; }).join('')}
    </div>
    <p style="text-align:center;margin-top:18px"><button class="link" id="reset">Reset progress</button></p>`;
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => {
    if (progress.current && !confirm('Starting a new test throws away the one in progress. Continue?')) return;
    start(+b.dataset.start);
  });
  document.getElementById('reset').onclick = () => { if (confirm('Erase all certifications, question history, and practice stats?')){ progress = fresh(); save(); testHome(); } };
  bindCommon(home);
}

// ---------- practice & learn ----------
function topicButton(g, s, t, showWhere){
  const st = progress.topics[topicKey(g, s, t.id)], weak = st && st.miss - st.right / 2 > 0;
  const status = [weak ? `<span class="warn">Missed ${st.miss} on tests</span>` : '', st?.tries ? `${st.right}/${st.tries} right in practice` : 'Not practiced yet'].filter(Boolean).join(' · ');
  return `<button class="topic${weak ? ' weak' : ''}" data-topic="${g}|${s}|${t.id}">
    ${showWhere ? `<small>${ord(g)} grade · ${s}</small>` : ''}<b>${esc(t.name)}</b><small>${status}</small></button>`;
}

const SUBJECT_ICON = { Math: '➗', English: '📖', Science: '🔬', 'Social Studies': '🌎' };
const countQuestions = (g, s, id) => BANK[g][s].filter(x => !id || x.topic === id).length;

// Practice home: grade tabs, weak spots, and one card per subject.
function practiceHome(g = practiceGrade){
  practiceGrade = g; test = null; prac = null;
  const weak = weakSpots().slice(0, 6);
  app.innerHTML = `
    <div class="topbar"><button class="link" id="back">← Home</button></div>
    <h1 class="page-title">📚 Practice &amp; Learn</h1>
    <p class="rules">Pick a subject, then a topic. Each topic has a quick lesson and unlimited practice. Practice never counts against your tests.</p>
    ${weak.length ? `<h2 class="section">⚠️ Your weak spots</h2>
      <p class="rules">Topics you've missed on tests. Get practice questions right to clear them.</p>
      <div class="topics">${weak.map(w => topicButton(w.g, w.s, findTopic(w.g, w.s, w.id), true)).join('')}</div>` : ''}
    <div class="tabs">${GRADES.map(x => `<button data-grade="${x}" class="${x === g ? 'on' : ''}">${ord(x)} Grade</button>`).join('')}</div>
    <div class="subjects">${SUBJECTS.map(s => {
      const topics = LESSONS[g][s], stats = topics.map(t => progress.topics[topicKey(g, s, t.id)]).filter(Boolean);
      const right = stats.reduce((n, st) => n + st.right, 0), tries = stats.reduce((n, st) => n + st.tries, 0);
      const weakN = stats.filter(st => st.miss - st.right / 2 > 0).length;
      return `<button class="subject" data-subject="${s}">
        <span class="icon">${SUBJECT_ICON[s]}</span>
        <span class="info"><b>${s}</b>
          <small>${topics.length} topics · ${countQuestions(g, s)} question types</small>
          <small>${tries ? `${right}/${tries} right in practice` : 'Not practiced yet'}${weakN ? ` · <span class="warn">${weakN} weak spot${weakN > 1 ? 's' : ''}</span>` : ''}</small></span>
        <span class="chev">›</span></button>`; }).join('')}
    </div>`;
  app.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => practiceHome(+b.dataset.grade));
  app.querySelectorAll('[data-subject]').forEach(b => b.onclick = () => subjectPage(g, b.dataset.subject));
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { const [tg, ts, id] = b.dataset.topic.split('|'); lesson(+tg, ts, id); });
  bindCommon(home);
}

// One subject: a mixed-practice button and every topic with what it covers.
function subjectPage(g, s){
  practiceGrade = g; prac = null;
  app.innerHTML = `
    <div class="topbar"><button class="link" id="back">← All subjects</button></div>
    <h1 class="page-title">${SUBJECT_ICON[s]} ${s} <small class="grade-note">${ord(g)} grade</small></h1>
    <button class="mix" id="mix"><b>🔀 Practice all of ${s}</b><small>Mixed questions from every topic below</small></button>
    <h2 class="section">Topics</h2>
    <div class="topic-list">${LESSONS[g][s].map(t => {
      const st = progress.topics[topicKey(g, s, t.id)], weak = st && st.miss - st.right / 2 > 0;
      return `<button class="topic wide${weak ? ' weak' : ''}" data-topic="${g}|${s}|${t.id}">
        <b>${esc(t.name)}</b>
        <span class="covers">${esc(t.covers)}</span>
        <small>${countQuestions(g, s, t.id)} question types · ${[weak ? `<span class="warn">Missed ${st.miss} on tests</span>` : '', st?.tries ? `${st.right}/${st.tries} right in practice` : 'Not practiced yet'].filter(Boolean).join(' · ')}</small>
      </button>`; }).join('')}
    </div>`;
  document.getElementById('mix').onclick = () => { prac = { g, s, id: null, streak: 0, right: 0, total: 0, last: null }; nextPractice(); };
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => lesson(g, s, b.dataset.topic.split('|')[2]));
  bindCommon(() => practiceHome(g));
}

function lesson(g, s, id){
  prac = null;
  const t = findTopic(g, s, id);
  app.innerHTML = `
    <div class="topbar"><button class="link" id="back">← All topics</button></div>
    <div class="card lesson">
      <span class="tag">${ord(g)} grade · ${s}</span>
      <h1>${esc(t.name)}</h1>
      <p class="covers">Covers: ${esc(t.covers)}</p>
      <p class="intro">${esc(t.intro)}</p>
      <h3>Key rules</h3>
      <ul class="points">${t.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <h3>Worked example</h3>
      <div class="example"><div class="prob">${esc(t.ex[0])}</div><div>${esc(t.ex[1])}</div></div>
      <div class="actions"><button class="primary" id="practice">Practice this topic →</button></div>
    </div>`;
  document.getElementById('practice').onclick = () => { prac = { g, s, id, streak: 0, right: 0, total: 0, last: null }; nextPractice(); };
  bindCommon(() => subjectPage(g, s));
}

// Practice one topic (p.id) or, when p.id is null, a mix of the whole subject.
function nextPractice(){
  const p = prac, t = p.id && findTopic(p.g, p.s, p.id), items = BANK[p.g][p.s].filter(x => !p.id || x.topic === p.id);
  let q, it;
  for (let i = 0; i < 20; i++){   // avoid showing the exact same question twice in a row
    it = pick(items);
    q = typeof it === 'function' ? it() : MQ(it[0], it[1], shuffle(it[2]), it[3]);
    if (q.q + q.answer !== p.last) break;
  }
  q.topic = it.topic;
  p.q = q; p.last = q.q + q.answer; p.answered = false;
  app.innerHTML = `
    <div class="topbar"><button class="link" id="back">← ${t ? 'Lesson' : 'Topics'}</button><span><b>${t ? esc(t.name) : `All of ${p.s}`}</b></span><span id="pstats"></span></div>
    <div class="card">
      <span class="tag">Practice · ${t ? p.s : esc(findTopic(p.g, p.s, q.topic).name)}</span>
      <div class="q">${esc(q.q)}</div>
      <div class="choices">${q.choices.map((c, k) => `<button data-k="${k}"><kbd>${k + 1}</kbd><span>${esc(c)}</span></button>`).join('')}</div>
      <div id="feedback"></div>
    </div>`;
  drawPracticeStats();
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => practiceAnswer(+b.dataset.k));
  bindCommon(() => p.id ? lesson(p.g, p.s, p.id) : subjectPage(p.g, p.s));
}
const drawPracticeStats = () => { document.getElementById('pstats').textContent = `🔥 Streak ${prac.streak} · ${prac.right}/${prac.total} right`; };

function practiceAnswer(k){
  const p = prac; if (!p || p.answered) return;
  p.answered = true;
  const q = p.q, ok = q.choices[k] === q.answer, st = tstat(topicKey(p.g, p.s, q.topic));
  p.total++; st.tries++;
  if (ok){ p.right++; p.streak++; st.right++; p.streak % 5 === 0 ? Sound.milestone() : Sound.right(); }
  else { p.streak = 0; Sound.wrong(); }
  save();
  drawPracticeStats();
  app.querySelectorAll('[data-k]').forEach((b, i) => {
    b.disabled = true;
    if (q.choices[i] === q.answer) b.classList.add('correct'); else if (i === k) b.classList.add('wrong');
  });
  document.getElementById('feedback').innerHTML = `
    <div class="ans ${ok ? 'right' : 'yours'}">${ok ? `✓ Correct!${p.streak >= 3 ? ` ${p.streak} in a row 🔥` : ''}` : `✗ Not quite. The answer is: ${esc(q.answer)}`}</div>
    <div class="fix"><b>${ok ? 'Why:' : 'How to fix it:'}</b> ${esc(q.explain)}</div>
    <div class="actions"><button class="primary" id="nextq">Next question →</button></div>`;
  document.getElementById('nextq').onclick = nextPractice;
}

function start(grade){
  test = { grade, qs: buildTest(grade), i: 0, right: 0, misses: [], locked: false };
  progress.current = test; save();
  showQuestion();
}

function showQuestion(){
  const t = test, q = t.qs[t.i];
  t.locked = false;
  app.innerHTML = `
    <div class="topbar"><span><b>${ord(t.grade)} Grade Test</b></span><span>Question ${t.i + 1} of ${TEST_LEN}</span>
      <span>Misses: ${t.misses.length} / ${MAX_MISSES} allowed</span>
      <button class="link" id="quit">Save &amp; exit</button></div>
    <div class="bar"><i style="width:${t.i / TEST_LEN * 100}%"></i></div>
    <div class="card">
      <span class="tag">${q.subject}</span>
      <div class="q">${esc(q.q)}</div>
      <div class="choices">${q.choices.map((c, k) => `<button data-k="${k}"><kbd>${k + 1}</kbd><span>${esc(c)}</span></button>`).join('')}</div>
    </div>`;
  window.scrollTo(0, 0);
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById('quit').onclick = home;
}

function answer(k){
  const t = test; if (!t || t.locked) return;
  t.locked = true;
  Sound.answer();
  const q = t.qs[t.i], chosen = q.choices[k];
  app.querySelector(`[data-k="${k}"]`).classList.add('picked');
  app.querySelectorAll('[data-k]').forEach(b => b.disabled = true);
  if (chosen === q.answer) t.right++;
  else {
    t.misses.push({ ...q, chosen });
    if (q.topic) tstat(topicKey(t.grade, q.subject, q.topic)).miss++;
  }
  setTimeout(() => {
    if (test !== t) return;
    t.i++;
    if (t.misses.length > MAX_MISSES || t.i === TEST_LEN) return results();
    if (t.i % PER_SUBJECT === 0) Sound.milestone();   // a little chime every 25 questions
    save(); showQuestion();
  }, 260);
}

function results(){
  const t = test, passed = t.misses.length <= MAX_MISSES && t.i === TEST_LEN;
  const next = GRADES[GRADES.indexOf(t.grade) + 1];
  if (passed){
    if (!progress.certified.includes(t.grade)) progress.certified.push(t.grade);
    progress.best[t.grade] = Math.max(progress.best[t.grade] || 0, t.right);
  }
  markSeen(t.qs.slice(0, t.i));
  progress.current = null;
  save();
  passed ? Sound.pass() : Sound.fail();
  const head = passed
    ? `<div class="card result-head pass"><div class="big">🎓</div>
        <h2>${ord(t.grade)} Grade Certified!</h2>
        <p>You scored <b>${t.right}/${TEST_LEN}</b>. You know everything you need to know in ${ord(t.grade)} grade.</p>
        <div class="actions">${next
          ? `<button class="primary" id="next">Start ${ord(next)} Grade →</button>`
          : `<p><b>You've passed every grade here. Top of the class!</b></p>`}
          <button id="home">All grades</button></div></div>`
    : `<div class="card result-head fail"><div class="big">📝</div>
        <h2>Not ${ord(t.grade)} grade level yet</h2>
        <p>You missed ${t.misses.length} questions (${t.right} right out of ${t.i} answered), so this test is over.
          Study the fixes below, then take a new test with different questions.</p>
        <div class="actions"><button class="primary" id="retry">Take a new randomized test</button><button id="home">All grades</button></div></div>`;
  const review = t.misses.length ? `
    <h2 class="section">${passed ? 'Still worth reviewing' : "What you got wrong — and how to fix it"}</h2>
    ${t.misses.map(m => `<div class="card miss">
      <span class="tag">${m.subject}</span>
      <div class="q">${esc(m.q)}</div>
      <div class="ans yours">✗ Your answer: ${esc(m.chosen)}</div>
      <div class="ans right">✓ Correct answer: ${esc(m.answer)}</div>
      <div class="fix"><b>How to fix it:</b> ${esc(m.explain)}</div>
      ${m.topic ? `<button class="link learn" data-learn="${m.subject}|${m.topic}">📚 Learn this topic: ${esc(findTopic(t.grade, m.subject, m.topic).name)} →</button>` : ''}
    </div>`).join('')}
    ${passed ? '' : `<div class="actions"><button class="primary" id="retry2">Take a new randomized test</button></div>`}` : '';
  app.innerHTML = head + review;
  window.scrollTo(0, 0);
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('next', () => start(next)); on('home', testHome);
  on('retry', () => start(t.grade)); on('retry2', () => start(t.grade));
  app.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => { test = null; const [s, id] = b.dataset.learn.split('|'); lesson(t.grade, s, id); });
}

document.addEventListener('keydown', e => {
  if (prac?.q && app.querySelector('[data-k]')){
    if (prac.answered){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); nextPractice(); } return; }
    const k = +e.key - 1; if (k >= 0 && k < prac.q.choices.length) practiceAnswer(k);
    return;
  }
  if (!test || test.locked || !app.querySelector('[data-k]')) return;
  const k = +e.key - 1; if (k >= 0 && k < test.qs[test.i].choices.length) answer(k);
});

home();
</script>
</body>
</html>
